<!doctype html><html><head><meta charset='utf-8'><title>LOCAL_HTML_LAYOUT_FIXTURE</title><style>html,body{margin:0;height:100%;background:#ddebe5;color:#193e32;font:16px system-ui}header{padding:20px;background:#244e40;color:#fff;font-size:18px}section{margin:20px;border:2px solid #537867;padding:24px;background:#eff7f1}button{padding:10px 20px;font-size:16px}#count{font-size:36px}</style></head><body><header>第二个合成 HTML 页面 · 顶边应从内容栏正文开始</header><section><h2>受控点击画布</h2><p>这不是用户文件，也不使用网络。</p><button id='counter'>点击 +1</button><output id='count'>0</output><canvas id='canvas' width='120' height='80'></canvas></section><script>window.fixtureLoaded=true;document.getElementById('counter').onclick=()=>document.getElementById('count').textContent='1';document.getElementById('canvas').getContext('2d').fillRect(10,10,60,40);</script></body></html>

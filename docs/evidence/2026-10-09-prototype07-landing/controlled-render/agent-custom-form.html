<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自定义 Agent：保留的表单 · 正式组件受控呈现</title><link rel="stylesheet" href="./production.css"><style>.evidence-banner{height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#20252b;color:white;font:12px system-ui;position:relative;z-index:10000;box-sizing:border-box}.evidence-banner a{color:white;text-decoration:underline}#root.evidence-root{height:calc(100vh - 36px)}.evidence-root:has(>dialog){background:var(--sidebar)}.evidence-root>dialog{top:36px}</style></head><body><aside class="evidence-banner"><span>受控数据 · 正式组件与当前生产 CSS · 非安装实测 · 静态预览</span><a href="./index.html">画册目录</a></aside><div id="root" class="evidence-root"><div class="app product-app"><div class="body-row"><div class="workspace-route"><main class="main agent-hub-main agent-redesign"></main></div></div><dialog open class="workspace-dialog" aria-label="自定义 Agent 接入"><div class="workspace-dialog-title"><h2>自定义 Agent 接入</h2><button type="button" class="icon-button" aria-label="关闭">×</button></div><form class="agent-custom-layout agent-custom-form"><div class="workspace-dialog-body custom-agent-fields"><p>指定你选择的程序和参数。添加不代表连接成功，能力由之后的检查结果决定。</p><p class="auth-note" role="status">已恢复本次应用内暂存的接入信息。</p><label>显示名称<input aria-invalid="false" value="我的受控 Agent"/></label><label>程序路径或命令<input aria-invalid="false" placeholder="/path/to/agent" value="/controlled/programs/custom-agent"/></label><button type="button" class="btn btn-ghost">选择程序文件…</button><label>参数（每行一个）<textarea rows="3">--example-mode

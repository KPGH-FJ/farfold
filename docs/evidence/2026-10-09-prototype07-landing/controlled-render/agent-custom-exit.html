<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自定义 Agent：离开前确认 · 正式组件受控呈现</title><link rel="stylesheet" href="./production.css"><style>.evidence-banner{height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#20252b;color:white;font:12px system-ui;position:relative;z-index:10000;box-sizing:border-box}.evidence-banner a{color:white;text-decoration:underline}#root.evidence-root{height:calc(100vh - 36px)}.evidence-root:has(>dialog){background:var(--sidebar)}.evidence-root>dialog{top:36px}</style></head><body><aside class="evidence-banner"><span>受控数据 · 正式组件与当前生产 CSS · 非安装实测 · 静态预览</span><a href="./index.html">画册目录</a></aside><div id="root" class="evidence-root"><div class="app product-app"><div class="body-row"><div class="workspace-route"><main class="main agent-hub-main agent-redesign"></main></div></div><dialog open class="workspace-dialog" aria-label="自定义 Agent 接入"><div class="workspace-dialog-title"><h2>自定义 Agent 接入</h2><button type="button" class="icon-button" aria-label="关闭">×</button></div><div class="agent-custom-layout agent-custom-exit"><div class="workspace-dialog-body"><h3>还有未保存的接入信息</h3><p>可以继续填写、放弃，或暂存后离开。暂存只保留到本次应用关闭，不写入磁盘。</p></div><footer class="agent-custom-exit-actions"><button class="btn btn-ghost">放弃并关闭</button><button class="btn btn-ghost">暂存并关闭</button><button autofocus="" class="btn btn-primary">继续填写</button></footer></div></dialog></div></div></body></html>

<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 管理：模型与思考程度 · 正式组件受控呈现</title><link rel="stylesheet" href="./production.css"><style>.evidence-banner{height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#20252b;color:white;font:12px system-ui;position:relative;z-index:10000;box-sizing:border-box}.evidence-banner a{color:white;text-decoration:underline}#root.evidence-root{height:calc(100vh - 36px)}.evidence-root:has(>dialog){background:var(--sidebar)}.evidence-root>dialog{top:36px}</style></head><body><aside class="evidence-banner"><span>受控数据 · 正式组件与当前生产 CSS · 非安装实测 · 静态预览</span><a href="./index.html">画册目录</a></aside><div id="root" class="evidence-root"><div class="app product-app"><div class="body-row"><div class="workspace-route"><main class="main agent-hub-main agent-redesign"><dialog open data-agent-redesign="true" class="agent-setup-dialog" data-intent="manage" aria-labelledby="agent-setup-title"><header class="agent-setup-header"><h2 id="agent-setup-title"><span class="id agent-logo c0">受</span>受控 Agent 设置</h2><button class="icon-btn" aria-label="关闭准备"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button></header><div class="agent-setup-context"><span title="/controlled/example-project">连接管理</span><span class="agent-setup-status tone-attention"><i aria-hidden="true"></i>未完成设置</span></div><div class="agent-setup-tabs" role="tablist" aria-label="Agent 设置分类"><button type="button" role="tab" id="agent-setup-tab-0" aria-controls="agent-setup-panel" aria-selected="false" tabindex="-1">程序</button><button type="button" role="tab" id="agent-setup-tab-1" aria-controls="agent-setup-panel" aria-selected="false" tabindex="-1">账号与服务</button><button type="button" role="tab" id="agent-setup-tab-2" aria-controls="agent-setup-panel" aria-selected="true" tabindex="0">模型</button></div><div class="agent-setup-body" id="agent-setup-panel" role="tabpanel" aria-labelledby="agent-setup-tab-2"><fieldset class="agent-setup-program-guard" hidden=""></fieldset><section class="agent-setup-selection"><h3>选择模型</h3><p class="agent-setup-subtitle">这里的模型选择用于新草稿或本次测试，不改变已有对话。</p><div class="agent-model-source" aria-label="服务来源"><span>服务来源</span><strong>沿用 Agent 已有设置</strong><small>具体服务由 Agent 决定</small></div><fieldset class="agent-setup-options"><div class="so-row"><span class="so-name">模型</span><div class="mp"><button type="button" class="mp-btn" aria-label="模型: 模型示例 A" aria-haspopup="listbox" aria-expanded="false" title="模型示例 A"><span class="mp-label">模型示例 A</span><span class="chev">▾</span></button></div></div><label class="so-row agent-setup-reasoning"><span class="so-name">思考程度</span><select aria-label="思考程度"><option value="low">低</option><option value="high" selected="">高</option></select></label></fieldset><div class="agent-model-reading"><p role="status">已读取当前模型选项</p><p class="agent-setup-note">读取选项不会发送模型请求。</p><button class="btn btn-ghost">重新读取模型</button></div><details class="agent-setup-test-note"><summary>发送一条短消息测试（可选）</summary><h4 role="status">尚未执行模型测试</h4><p>点击后会产生一条“连接测试”对话，并发送下面的短消息；可能使用你的账号额度。不会附加当前草稿或资料内容。</p><div class="agent-test-actions"><button class="btn btn-primary">发送测试消息</button></div><p class="agent-setup-note">模型测试可选；实际可用性以回复结果为准。</p></details><button class="btn btn-text">带入已有对话</button></section></div><footer class="agent-setup-footer"><div><button class="btn btn-ghost">返回账号与服务</button></div><div><button class="btn btn-ghost">暂时返回</button><button class="btn btn-primary">保存设置</button></div></footer></dialog></main></div></div></div></div></body></html>

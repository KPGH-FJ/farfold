<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 管理：账号与来源 · 正式组件受控呈现</title><link rel="stylesheet" href="./production.css"><style>.evidence-banner{height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#20252b;color:white;font:12px system-ui;position:relative;z-index:10000;box-sizing:border-box}.evidence-banner a{color:white;text-decoration:underline}#root.evidence-root{height:calc(100vh - 36px)}.evidence-root:has(>dialog){background:var(--sidebar)}.evidence-root>dialog{top:36px}</style></head><body><aside class="evidence-banner"><span>受控数据 · 正式组件与当前生产 CSS · 非安装实测 · 静态预览</span><a href="./index.html">画册目录</a></aside><div id="root" class="evidence-root"><div class="app product-app"><div class="body-row"><div class="workspace-route"><main class="main agent-hub-main agent-redesign"><dialog open data-agent-redesign="true" class="agent-setup-dialog" data-intent="manage" aria-labelledby="agent-setup-title"><header class="agent-setup-header"><h2 id="agent-setup-title"><span class="id agent-logo c0">受</span>受控 Agent 设置</h2><button class="icon-btn" aria-label="关闭准备"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button></header><div class="agent-setup-context"><span title="/controlled/example-project">连接管理</span><span class="agent-setup-status tone-attention"><i aria-hidden="true"></i>未完成设置</span></div><div class="agent-setup-tabs" role="tablist" aria-label="Agent 设置分类"><button type="button" role="tab" id="agent-setup-tab-0" aria-controls="agent-setup-panel" aria-selected="false" tabindex="-1">程序</button><button type="button" role="tab" id="agent-setup-tab-1" aria-controls="agent-setup-panel" aria-selected="true" tabindex="0">账号与服务</button><button type="button" role="tab" id="agent-setup-tab-2" aria-controls="agent-setup-panel" aria-selected="false" tabindex="-1" disabled="" title="先选择接入方式">模型</button></div><div class="agent-setup-body" id="agent-setup-panel" role="tabpanel" aria-labelledby="agent-setup-tab-1"><fieldset class="agent-setup-program-guard" hidden=""></fieldset><section class="auth agent-account-entry" aria-label="登录与账号设置"><div class="agent-account-heading"><h3>接入方式</h3></div><div class="journey-connection-summary connection-account-summary" aria-label="当前账号"><dl class="agent-current-facts"><div><dt>账号身份</dt><dd>example@example.invalid · 受控账号</dd></div><div><dt>认证方式</dt><dd>账号登录</dd></div><div><dt>账号方案</dt><dd>示例套餐</dd></div></dl><details class="agent-evidence-details"><summary>依据与范围</summary><p class="auth-note">未提供身份信息不等于未登录。</p><p class="auth-note">由 Agent 报告；实际服务与模型以当前选择为准。</p></details></div><fieldset class="journey-methods"><legend class="journey-sr-only">接入方式</legend><label class="journey-method-card"><input type="radio" name="connection-controlled-agent" checked="" value="[&quot;existing&quot;]"/><span><strong>已有设置</strong><small>example@example.invalid · 示例套餐</small></span></label><p class="journey-method-group">账号登录</p><label class="journey-method-card"><input type="radio" name="connection-controlled-agent" value="[&quot;method&quot;,&quot;example-browser&quot;]"/><span><strong>浏览器登录（受控样例）</strong><small>由 Agent 提供的登录方式示例</small></span></label><div class="agent-account-inline"><p class="auth-note">请通过 受控 Agent 的官方渠道注册账号</p></div><label class="journey-method-card"><input type="radio" disabled="" name="connection-controlled-agent" value="[&quot;api&quot;]"/><span><strong>模型 API 服务</strong><small>使用自定义地址和模型。</small></span></label></fieldset><details class="journey-details agent-account-more"><summary>管理接入</summary><details class="agent-account-more"><summary>更多登录选项</summary><div class="auth"><button type="button" class="btn btn-text">手动配置登录</button></div></details><div class="auth-actions journey-utilities"><button class="btn btn-text">重新连接</button><button class="btn btn-text">更换接入方式</button><button class="btn btn-text">退出登录</button><button class="btn btn-text">切换账号</button></div></details></section></div><footer class="agent-setup-footer"><div><button class="btn btn-ghost">返回程序</button></div><div><button class="btn btn-ghost">暂时返回</button></div></footer></dialog></main></div></div></div></div></body></html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Controlled P17 global saving and exit</title>
  </head>
  <body>
    <h1 style="font: 18px sans-serif; padding: 12px">
      P17 · actual global saving and exit components · controlled IPC
    </h1>
    <div id="app" style="height: 760px; padding: 24px"></div>
    <pre id="result"></pre>
    <script>
      window.controlCallbacks = new Map();
      window.callbackNext = 0;
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => window.fixture.invoke(cmd, args),
        transformCallback: (fn) => {
          const id = ++window.callbackNext;
          window.controlCallbacks.set(id, fn);
          return id;
        },
        unregisterCallback: (id) => window.controlCallbacks.delete(id),
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: () => {},
      };
    </script>
    <script type="module" src="./jobs.tsx"></script>
  </body>
</html>

[package]
name = "farfold"
version = "0.1.7"
description = "A desktop workspace for native agent runtimes"
authors = ["Farfold"]
edition = "2024"
default-run = "farfold"

[lib]
name = "farfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "acp-spike"
path = "src/bin/acp_spike.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "=2.2.0"
base64 = "0.22"
flate2 = "=1.1.9"
libc = "0.2"
minisign-verify = "=0.2.5"
portable-pty = "=0.9.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
tar = "=0.4.46"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.10.1"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" role="img" aria-label="host-complete"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1400" height="1300" fill="#f6f9fa"/><text x="40" y="39" class="title" text-anchor="start">共同的完整职责：不修改 Agent，也需要完整的 Farfold Host</text><text x="40" y="70" class="small" text-anchor="start">候选逻辑架构 · 方框表示职责，不要求分别部署 · 所有方案均保留 Agent 自己的循环与原生会话</text><rect x="40" y="96" width="1320" height="115" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="700.0" y="127" class="head" text-anchor="middle">Farfold 自有工作台</text><text x="700.0" y="157" class="body" text-anchor="middle">聊天与干预　｜　文件 / 差异 / 终端 / 产物　｜　项目 / 会话 / 安装 / 设置</text><text x="700.0" y="183" class="body" text-anchor="middle">共同组件 + 按能力启用的专属交互；所有操作经 Farfold 内部接口</text><path d="M470 219L470 253" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1155 219L1155 253" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="260" width="860" height="418" rx="17" fill="none" stroke="#91aab6" stroke-dasharray="7 5"/><text x="58" y="289" class="head" text-anchor="start">Host · 管理、状态与可靠性</text><rect x="60" y="312" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="255.0" y="343" class="head" text-anchor="middle">Agent 与安装管理</text><text x="255.0" y="373" class="body" text-anchor="middle">发现 / 安装 / 版本 / 依赖</text><text x="255.0" y="399" class="body" text-anchor="middle">启动定义 / 适配器 / 配置规则</text><rect x="490" y="312" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="685.0" y="343" class="head" text-anchor="middle">项目与会话管理</text><text x="685.0" y="373" class="body" text-anchor="middle">工作副本 / 身份绑定 / 历史引用</text><text x="685.0" y="399" class="body" text-anchor="middle">新建 / 返回 / 草稿 / 删除边界</text><rect x="60" y="432" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="255.0" y="463" class="head" text-anchor="middle">工作与交互控制</text><text x="255.0" y="493" class="body" text-anchor="middle">任务准入 / 取消 / 待答交互</text><text x="255.0" y="519" class="body" text-anchor="middle">状态确认 / 进程退出 / 恢复</text><rect x="490" y="432" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="685.0" y="463" class="head" text-anchor="middle">统一模型服务管理</text><text x="685.0" y="493" class="body" text-anchor="middle">目录 / 连接 / 模型映射 / 兼容</text><text x="685.0" y="519" class="body" text-anchor="middle">凭据归属 / 配置分发 / 生效状态</text><rect x="60" y="552" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="255.0" y="583" class="head" text-anchor="middle">事件与诊断服务</text><text x="255.0" y="613" class="body" text-anchor="middle">快照 + 增量 / 顺序与缺口</text><text x="255.0" y="639" class="body" text-anchor="middle">错误定位 / 输出边界 / 通知</text><rect x="490" y="552" width="390" height="104" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="685.0" y="583" class="head" text-anchor="middle">Farfold 自有数据</text><text x="685.0" y="613" class="body" text-anchor="middle">项目 / 布局 / 绑定 / 审阅记录</text><text x="685.0" y="639" class="body" text-anchor="middle">事务 / 迁移 / 备份与恢复</text><rect x="950" y="260" width="410" height="247" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="1155.0" y="291" class="head" text-anchor="middle">Host · 工作环境服务</text><text x="1155.0" y="321" class="body" text-anchor="middle">文件读取 / 预览 / 变化观察</text><text x="1155.0" y="347" class="body" text-anchor="middle">Git 状态 / 基线 / 实际差异</text><text x="1155.0" y="373" class="body" text-anchor="middle">终端创建 / 输出 / 释放</text><text x="1155.0" y="399" class="body" text-anchor="middle">资源与路径边界 / 产物定位</text><text x="1155.0" y="425" class="body" text-anchor="middle">服务工作台，也承接 ACP 回调</text><path d="M1155 514L1155 569" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="950" y="578" width="410" height="116" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="1155.0" y="609" class="head" text-anchor="middle">实际工作目录与文件</text><text x="1155.0" y="639" class="body" text-anchor="middle">用户、Agent、外部工具均可能修改</text><text x="1155.0" y="665" class="body" text-anchor="middle">保留来源，不自动归因于某次任务</text><path d="M470 685L470 728" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="738" width="860" height="153" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="470.0" y="769" class="head" text-anchor="middle">公共 ACP 客户端</text><text x="470.0" y="799" class="body" text-anchor="middle">协议版本 / 认证 / 会话 / 消息 / 工具与变更事件</text><text x="470.0" y="825" class="body" text-anchor="middle">权限与提问 / 配置与能力 / 取消 / 扩展</text><text x="470.0" y="851" class="body" text-anchor="middle">Agent 请求文件或终端时，调用 Host 对应服务</text><path d="M905 810H923V472H944" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="6 5"/><text x="945" y="730" class="small" text-anchor="start">虚线：按能力提供的文件 / 终端回调</text><text x="945" y="763" class="small" text-anchor="start">Provider 配置由 Host 按原生方式应用；</text><text x="945" y="790" class="small" text-anchor="start">不要求通过 ACP 传递模型密钥。</text><path d="M182 898L182 942" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M470 898L470 942" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M758 898L758 942" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="952" width="284" height="88" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="182.0" y="983" class="head" text-anchor="middle">Pi ACP 适配器</text><text x="182.0" y="1013" class="body" text-anchor="middle">候选：已有本机 Pi 接入路径</text><rect x="328" y="952" width="284" height="88" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="470.0" y="983" class="head" text-anchor="middle">OpenCode ACP 入口</text><text x="470.0" y="1013" class="body" text-anchor="middle">原生支持，无需额外转换层</text><rect x="616" y="952" width="284" height="88" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="758.0" y="983" class="head" text-anchor="middle">Codex ACP 适配器</text><text x="758.0" y="1013" class="body" text-anchor="middle">候选：固定接入包后验证</text><path d="M182 1047L182 1080" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M470 1047L470 1080" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M758 1047L758 1080" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="1090" width="860" height="105" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="470.0" y="1121" class="head" text-anchor="middle">外部 Agent 本体：Pi / OpenCode / Codex</text><text x="470.0" y="1151" class="body" text-anchor="middle">自己的推理循环、工具决策、原生会话、权限与上下文管理</text><text x="470.0" y="1177" class="body" text-anchor="middle">程序来自本机安装或按需安装；不修改 Agent 本体</text><path d="M905 1128H930V634H944" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="928" class="small" text-anchor="start">Agent 通过原生工具读写工作目录</text><rect x="950" y="1060" width="410" height="135" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="1155.0" y="1091" class="head" text-anchor="middle">外部模型服务 / Provider</text><text x="1155.0" y="1121" class="body" text-anchor="middle">实际模型调用由 Agent 完成</text><text x="1155.0" y="1147" class="body" text-anchor="middle">ACP 客户端不替代 Agent 调模型</text><text x="1155.0" y="1173" class="body" text-anchor="middle">各 Agent 原生登录仍可独立存在</text><path d="M907 1163L942 1163" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="40" y="1244" class="body" text-anchor="start">两条信息来源并存：Agent 通过 ACP 报告过程；Host 直接观察文件与 Git 的实际状态。</text><text x="40" y="1276" class="small" text-anchor="start">开发旧会话不迁移；保留重要配置，新建会话仍须可靠恢复。本图为候选设计。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" role="img" aria-label="host-three-options"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1500" height="690" fill="#f6f9fa"/><text x="35" y="39" class="title" text-anchor="start">三套可选形态：公共职责相同，Host 运行在哪里不同</text><text x="35" y="70" class="small" text-anchor="start">三者都可以统一 ACP，不修改 Agent。它们是产品运行方式的选择，不是三套通信协议。</text><text x="35" y="120" class="head" text-anchor="start">A · 应用内 Host</text><text x="35" y="151" class="small" text-anchor="start">当前优先建议</text><text x="535" y="120" class="head" text-anchor="start">B · 独立本地 Host</text><text x="535" y="151" class="small" text-anchor="start">需要后台持续工作时考虑</text><text x="1035" y="120" class="head" text-anchor="start">C · 服务端 Host</text><text x="1035" y="151" class="small" text-anchor="start">需要远程设备时才考虑</text><rect x="35" y="176" width="430" height="309" rx="17" fill="none" stroke="#91aab6" stroke-dasharray="7 5"/><text x="53" y="205" class="head" text-anchor="start">同一个桌面应用</text><rect x="55" y="220" width="390" height="80" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="250.0" y="251" class="head" text-anchor="middle">Farfold 前端</text><text x="250.0" y="281" class="body" text-anchor="middle">自己的完整工作界面</text><path d="M250 308L250 334" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="55" y="345" width="390" height="116" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="250.0" y="376" class="head" text-anchor="middle">完整 Host + ACP 客户端</text><text x="250.0" y="406" class="body" text-anchor="middle">Tauri 后端内组织公共服务</text><text x="250.0" y="432" class="body" text-anchor="middle">沿用本机项目、数据与配置</text><path d="M250 493L250 518" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="55" y="530" width="390" height="69" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="250.0" y="561" class="head" text-anchor="middle">本机 Agent / ACP 适配器</text><text x="250" y="636" class="small" text-anchor="middle">维护最直接；退出应用结束自有进程</text><text x="250" y="663" class="small" text-anchor="middle">关闭窗口与退出应用须分别定义</text><rect x="555" y="220" width="390" height="80" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="750.0" y="251" class="head" text-anchor="middle">Farfold 前端进程</text><text x="750.0" y="281" class="body" text-anchor="middle">界面可独立退出和重新连接</text><path d="M750 308L750 365" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="555" y="375" width="390" height="110" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="750.0" y="406" class="head" text-anchor="middle">本地 Host 守护进程 + ACP</text><text x="750.0" y="436" class="body" text-anchor="middle">独立持有会话、进程与数据</text><text x="750.0" y="462" class="body" text-anchor="middle">本地受控连接，不必开放网络</text><path d="M750 493L750 518" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="555" y="530" width="390" height="69" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="750.0" y="561" class="head" text-anchor="middle">本机 Agent / ACP 适配器</text><text x="750" y="636" class="small" text-anchor="middle">界面退出后仍可工作；增加进程维护</text><text x="750" y="663" class="small" text-anchor="middle">需要重连、鉴权、升级和版本匹配</text><rect x="1055" y="220" width="390" height="80" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="1250.0" y="251" class="head" text-anchor="middle">桌面 / 浏览器客户端</text><text x="1250.0" y="281" class="body" text-anchor="middle">用户查看与操作远程工作</text><path d="M1250 308L1250 365" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="1055" y="375" width="390" height="110" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="1250.0" y="406" class="head" text-anchor="middle">远程 Host 服务 + ACP</text><text x="1250.0" y="436" class="body" text-anchor="middle">项目、Agent、凭据在服务端</text><text x="1250.0" y="462" class="body" text-anchor="middle">客户端通过认证的网络连接</text><path d="M1250 493L1250 518" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="1055" y="530" width="390" height="69" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="1250.0" y="561" class="head" text-anchor="middle">服务端 Agent / ACP 适配器</text><text x="1250" y="636" class="small" text-anchor="middle">支持多端访问；增加网络与远程运维</text><text x="1250" y="663" class="small" text-anchor="middle">本轮仅比较，不纳入当前开发范围</text></svg>
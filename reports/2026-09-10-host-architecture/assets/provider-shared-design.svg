<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-label="provider-shared-design"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1400" height="1120" fill="#f6f9fa"/><text x="40" y="40" class="title" text-anchor="start">统一模型服务：配置共享，与 ACP 工作通信分开</text><text x="40" y="73" class="small" text-anchor="start">候选设计 · 一次添加连接，供兼容 Agent 使用 · 不修改 Agent 本体，不把多个订阅额度合并</text><rect x="40" y="105" width="1320" height="112" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="700.0" y="136" class="head" text-anchor="middle">Farfold：一个模型服务入口</text><text x="700.0" y="166" class="body" text-anchor="middle">供应商品牌 → 地区 / 套餐 → 我的连接 → 模型与兼容 Agent</text><text x="700.0" y="192" class="body" text-anchor="middle">同名模型确认等价后归并展示；真实来源、模型 ID 与调用方式仍保留</text><path d="M700 225L700 255" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="265" width="1320" height="315" rx="17" fill="none" stroke="#91aab6" stroke-dasharray="7 5"/><text x="58" y="294" class="head" text-anchor="start">Host · 统一模型服务管理</text><rect x="60" y="316" width="400" height="112" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="260.0" y="347" class="head" text-anchor="middle">目录与连接记录</text><text x="260.0" y="377" class="body" text-anchor="middle">品牌别名 / 地区 / 套餐 / 接口类型</text><text x="260.0" y="403" class="body" text-anchor="middle">端点 / 凭据引用 / 模型映射 / 版本</text><rect x="500" y="316" width="400" height="112" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="700.0" y="347" class="head" text-anchor="middle">兼容与生效管理</text><text x="700.0" y="377" class="body" text-anchor="middle">按 Agent / 适配器 / 模型确认可用性</text><text x="700.0" y="403" class="body" text-anchor="middle">已保存 ≠ 已应用 ≠ 已验证能请求</text><rect x="940" y="316" width="400" height="112" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="1140.0" y="347" class="head" text-anchor="middle">配置归属与凭据</text><text x="1140.0" y="377" class="body" text-anchor="middle">公共记录为管理来源；原生配置是投影</text><text x="1140.0" y="403" class="body" text-anchor="middle">专属登录由原生管理；不盲写全局配置</text><text x="700" y="476" class="body" text-anchor="middle">保存共同配置 → 生成各 Agent 所需配置 → 分别应用 → 确认生效版本</text><text x="700" y="510" class="body" text-anchor="middle">某一路失败，只显示该路失败；已运行任务继续使用原配置，下一轮安全应用新配置</text><text x="700" y="547" class="small" text-anchor="middle">启动参数、环境变量、官方配置接口或受管理文件：按每个 Agent 实际支持选择</text><path d="M250 588L250 624" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M700 588L700 624" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1150 588L1150 624" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="635" width="420" height="112" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="250.0" y="666" class="head" text-anchor="middle">Pi 配置适配</text><text x="250.0" y="696" class="body" text-anchor="middle">映射原生 Provider / 模型 / 认证方式</text><text x="250.0" y="722" class="body" text-anchor="middle">与 ACP 接入包使用同一安装和配置环境</text><rect x="490" y="635" width="420" height="112" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="700.0" y="666" class="head" text-anchor="middle">OpenCode 配置适配</text><text x="700.0" y="696" class="body" text-anchor="middle">映射原生 Provider / 模型 / 认证方式</text><text x="700.0" y="722" class="body" text-anchor="middle">与 ACP 接入包使用同一安装和配置环境</text><rect x="940" y="635" width="420" height="112" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="1150.0" y="666" class="head" text-anchor="middle">Codex 配置适配</text><text x="1150.0" y="696" class="body" text-anchor="middle">映射原生 Provider / 模型 / 认证方式</text><text x="1150.0" y="722" class="body" text-anchor="middle">与 ACP 接入包使用同一安装和配置环境</text><path d="M250 755L250 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M700 755L700 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1150 755L1150 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="800" width="1320" height="87" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="700.0" y="831" class="head" text-anchor="middle">原生 Agent 使用生效配置，自己向模型服务发请求</text><text x="700.0" y="861" class="body" text-anchor="middle">可共享的普通 API / 支持该工具的 Coding Plan；专属登录保持独立</text><path d="M700 895L700 928" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="400" y="940" width="600" height="87" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="700.0" y="971" class="head" text-anchor="middle">外部模型服务</text><text x="700.0" y="1001" class="body" text-anchor="middle">请求、额度与计费仍按实际连接和套餐执行</text><text x="40" y="1070" class="body" text-anchor="start">另一条线保持不变：工作台 ↔ Host ↔ 公共 ACP ↔ Agent。ACP 不自动统一模型凭据。</text><text x="40" y="1100" class="small" text-anchor="start">模型代理 / 协议转换 / 自动故障切换可后续独立评估；本轮建议先采用配置分发。</text></svg>
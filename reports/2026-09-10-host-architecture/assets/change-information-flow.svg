<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-label="change-information-flow"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1400" height="610" fill="#f6f9fa"/><text x="40" y="40" class="title" text-anchor="start">用代码变更说明：信息从哪里来，谁负责展示</text><text x="40" y="72" class="small" text-anchor="start">不需要修改 Agent；工作台把两类信息并列呈现，不把它们混成一个事实。</text><rect x="40" y="127" width="310" height="113" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="195.0" y="158" class="head" text-anchor="middle">Agent 报告的操作</text><text x="195.0" y="188" class="body" text-anchor="middle">工具状态 / 文件位置 / diff</text><text x="195.0" y="214" class="body" text-anchor="middle">是操作报告，可能不完整</text><path d="M360 183L480 183" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="127" width="350" height="113" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="665.0" y="158" class="head" text-anchor="middle">ACP 客户端与事件投影</text><text x="665.0" y="188" class="body" text-anchor="middle">按协议接收、关联会话与工具</text><text x="665.0" y="214" class="body" text-anchor="middle">保留来源、状态和扩展</text><path d="M850 183L970 183" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="980" y="127" width="380" height="113" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="1170.0" y="158" class="head" text-anchor="middle">前端：过程与工具卡片</text><text x="1170.0" y="188" class="body" text-anchor="middle">显示某次操作的差异与进度</text><text x="1170.0" y="214" class="body" text-anchor="middle">权限选择经 ACP 回传 Agent</text><rect x="40" y="330" width="310" height="113" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="195.0" y="361" class="head" text-anchor="middle">工作目录实际状态</text><text x="195.0" y="391" class="body" text-anchor="middle">磁盘文件 / Git / 已有修改</text><text x="195.0" y="417" class="body" text-anchor="middle">也可能有用户或外部工具修改</text><path d="M360 386L480 386" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="330" width="350" height="113" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="665.0" y="361" class="head" text-anchor="middle">Host 文件与差异服务</text><text x="665.0" y="391" class="body" text-anchor="middle">读取状态、基线和实际差异</text><text x="665.0" y="417" class="body" text-anchor="middle">处理未跟踪文件与冲突</text><path d="M850 386L970 386" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="980" y="330" width="380" height="113" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="1170.0" y="361" class="head" text-anchor="middle">前端：文件与审阅面板</text><text x="1170.0" y="391" class="body" text-anchor="middle">变更列表 / 逐行对照 / 文件定位</text><text x="1170.0" y="417" class="body" text-anchor="middle">显示比较基线和审阅状态</text><text x="40" y="507" class="body" text-anchor="start">权限批准 ≠ 文件审阅；标记已审阅 ≠ 应用修改；撤销修改需要另行定义冲突与恢复规则。</text><text x="40" y="546" class="body" text-anchor="start">同样的方法可用于文档、图片和其他产物：Agent 报告 + Host 定位实际产物 + 合适的前端预览。</text><text x="40" y="581" class="small" text-anchor="start">文件 / 终端回调是可选协作方式；Agent 自己执行工具时，Host 的观察不能宣称完整沙箱或执行控制。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1390" role="img" aria-label="configuration-and-recovery-flow"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1400" height="1390" fill="#f6f9fa"/><text x="40" y="42" class="title" text-anchor="start">把“配好了”和“工作结束了”分别说清楚</text><text x="40" y="74" class="small" text-anchor="start">建议状态流程 · Host 记录事实，不代替 Agent 决策 · 本图没有表示已完成实现</text><rect x="25" y="98" width="1350" height="585" rx="17" fill="none" stroke="#91aab6" stroke-dasharray="7 5"/><text x="43" y="127" class="head" text-anchor="start">A · 一次保存配置，各 Agent 分别确认生效</text><rect x="50" y="155" width="280" height="140" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="190.0" y="186" class="head" text-anchor="middle">已保存</text><text x="190.0" y="216" class="body" text-anchor="middle">公共目录与连接记录</text><text x="190.0" y="242" class="body" text-anchor="middle">凭据安全存储</text><rect x="390" y="155" width="280" height="140" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="530.0" y="186" class="head" text-anchor="middle">待应用</text><text x="530.0" y="216" class="body" text-anchor="middle">按兼容目标生成配置</text><text x="530.0" y="242" class="body" text-anchor="middle">活动任务继续旧版本</text><rect x="730" y="155" width="280" height="140" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="870.0" y="186" class="head" text-anchor="middle">已应用</text><text x="870.0" y="216" class="body" text-anchor="middle">目标原生配置已确认</text><text x="870.0" y="242" class="body" text-anchor="middle">需要时重启自有进程</text><rect x="1070" y="155" width="280" height="140" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="1210.0" y="186" class="head" text-anchor="middle">验证真实请求</text><text x="1210.0" y="216" class="body" text-anchor="middle">成功：请求已验证</text><text x="1210.0" y="242" class="body" text-anchor="middle">只证明该连接与模型</text><path d="M335 225L381 225" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 225L721 225" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><path d="M1015 225L1061 225" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 299L530 355" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="365" width="620" height="125" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="360.0" y="396" class="head" text-anchor="middle">应用失败：只标记失败的那一路</text><text x="360.0" y="426" class="body" text-anchor="middle">保留旧有效配置；给出重试或修正入口</text><text x="360.0" y="452" class="body" text-anchor="middle">其他已生效 Agent 不被回滚成未配置</text><path d="M1210 299L1210 355" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="365" width="620" height="125" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="1040.0" y="396" class="head" text-anchor="middle">请求失败：保留配置与失败原因</text><text x="1040.0" y="426" class="body" text-anchor="middle">区分认证、额度、网络和不支持的模型</text><text x="1040.0" y="452" class="body" text-anchor="middle">不自动换账号，不把失败误说成配置丢失</text><rect x="50" y="530" width="1300" height="110" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="700.0" y="561" class="head" text-anchor="middle">每个目标分别记录，用户看到真实状态</text><text x="700.0" y="591" class="body" text-anchor="middle">Pi 已应用 / OpenCode 待应用 / Codex 不兼容，可以同时成立；保存成功不能显示为全部可用</text><rect x="25" y="720" width="1350" height="625" rx="17" fill="none" stroke="#91aab6" stroke-dasharray="7 5"/><text x="43" y="749" class="head" text-anchor="start">B · 工作、等待与断线：不重复执行、不伪造完成</text><rect x="50" y="780" width="300" height="120" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="200.0" y="811" class="head" text-anchor="middle">就绪 → 发送中</text><text x="200.0" y="841" class="body" text-anchor="middle">先绑定原生身份与配置</text><text x="200.0" y="867" class="body" text-anchor="middle">保留草稿和本次发送记录</text><path d="M355 840L422 840" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="780" width="450" height="120" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="655.0" y="811" class="head" text-anchor="middle">执行中 ↔ 等待用户</text><text x="655.0" y="841" class="body" text-anchor="middle">权限 / 提问绑定准确请求</text><text x="655.0" y="867" class="body" text-anchor="middle">取消、超时、换连接后旧按钮失效</text><path d="M885 840L952 840" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="780" width="390" height="120" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="1155.0" y="811" class="head" text-anchor="middle">已结束 / 已失败</text><text x="1155.0" y="841" class="body" text-anchor="middle">依据原生终态或可核实退出</text><text x="1155.0" y="867" class="body" text-anchor="middle">保留真实文件变化与原因</text><path d="M655 903L655 946" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="955" width="450" height="110" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="655.0" y="986" class="head" text-anchor="middle">用户停止 → 取消中</text><text x="655.0" y="1016" class="body" text-anchor="middle">原生确认后收敛；超时则待确认</text><path d="M885 1010 L1155 1010 L1155 906" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="994" class="small" text-anchor="middle">确认终态</text><path d="M200 905 L200 1150" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="205" y="1106" class="small" text-anchor="start">失联 / 接受情况未知</text><path d="M650 1070 L650 1150" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="50" y="1160" width="1300" height="140" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="700.0" y="1191" class="head" text-anchor="middle">状态待确认 → 核对原生状态，再恢复显示或结束</text><text x="700.0" y="1221" class="body" text-anchor="middle">发送后失联不盲目重发；不把“界面没收到”当成 Agent 没执行</text><text x="700.0" y="1247" class="body" text-anchor="middle">崩溃后不靠 Host 日志自行续跑 Agent 循环；旧请求回复失效，磁盘改动不会因取消自动撤销</text></svg>
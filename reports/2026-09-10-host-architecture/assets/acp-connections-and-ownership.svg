<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" role="img" aria-label="acp-connections-and-ownership"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#647984" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#213d46}.title{font-size:25px;font-weight:650}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#5a727b}</style><rect width="1400" height="1090" fill="#f6f9fa"/><text x="40" y="42" class="title" text-anchor="start">一套 ACP 实现，可以管理多个独立连接</text><text x="40" y="74" class="small" text-anchor="start">建议的首轮边界 · 不新增原生旁路 · 不把一个连接当成整个工作台</text><rect x="40" y="100" width="1320" height="110" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="700.0" y="131" class="head" text-anchor="middle">Farfold 自有工作台</text><text x="700.0" y="161" class="body" text-anchor="middle">同一套聊天、权限、提问、文件与审阅界面；按实际能力显示入口</text><path d="M700 212L700 243" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="250" width="1320" height="140" rx="13" fill="#eaf0fc" stroke="#9daed3" stroke-width="1.5"/><text x="700.0" y="281" class="head" text-anchor="middle">Host：任务、身份、配置与资源的统一管理</text><text x="700.0" y="311" class="body" text-anchor="middle">会话绑定：项目 / 工作副本 + Agent 安装 + 原生会话 + 连接代次</text><text x="700.0" y="337" class="body" text-anchor="middle">任务绑定：已生效的配置版本；保留两条活动任务与工作副本互斥</text><path d="M700 392L700 423" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="430" width="1320" height="110" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="700.0" y="461" class="head" text-anchor="middle">公共 ACP 客户端：共用代码与事件规则</text><text x="700.0" y="491" class="body" text-anchor="middle">握手、会话、请求 / 事件、取消、权限 / 提问、扩展协商、按能力调用本机资源</text><path d="M250 545L250 591" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="600" width="420" height="140" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="250.0" y="631" class="head" text-anchor="middle">连接实例 A · Pi 会话</text><text x="250.0" y="661" class="body" text-anchor="middle">固定适配器 + 选定本机 Pi</text><text x="250.0" y="687" class="body" text-anchor="middle">按需启动；独立会话与配置</text><path d="M250 743L250 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="795" width="420" height="100" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="250.0" y="826" class="head" text-anchor="middle">外部 Agent 本体</text><text x="250.0" y="856" class="body" text-anchor="middle">保持原生循环、工具和上下文</text><path d="M700 545L700 591" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="490" y="600" width="420" height="140" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="700.0" y="631" class="head" text-anchor="middle">连接实例 B · OpenCode</text><text x="700.0" y="661" class="body" text-anchor="middle">选定 OpenCode 的原生 ACP</text><text x="700.0" y="687" class="body" text-anchor="middle">固定版本；独立会话与配置</text><path d="M700 743L700 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="490" y="795" width="420" height="100" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="700.0" y="826" class="head" text-anchor="middle">外部 Agent 本体</text><text x="700.0" y="856" class="body" text-anchor="middle">保持原生循环、工具和上下文</text><path d="M1150 545L1150 591" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="940" y="600" width="420" height="140" rx="13" fill="#fff" stroke="#b7c8ce" stroke-width="1.5"/><text x="1150.0" y="631" class="head" text-anchor="middle">连接实例 C · Codex</text><text x="1150.0" y="661" class="body" text-anchor="middle">固定适配器 + 选定 Codex</text><text x="1150.0" y="687" class="body" text-anchor="middle">适配器内部连接 App Server</text><path d="M1150 743L1150 789" fill="none" stroke="#647984" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="940" y="795" width="420" height="100" rx="13" fill="#eaf4ee" stroke="#90b69f" stroke-width="1.5"/><text x="1150.0" y="826" class="head" text-anchor="middle">外部 Agent 本体</text><text x="1150.0" y="856" class="body" text-anchor="middle">保持原生循环、工具和上下文</text><text x="40" y="925" class="small" text-anchor="start">连接数量由会话需要决定；三列代表接入类型，不代表允许三个任务同时执行</text><rect x="40" y="940" width="1320" height="115" rx="13" fill="#fff1db" stroke="#d4b17a" stroke-width="1.5"/><text x="700.0" y="971" class="head" text-anchor="middle">连接与进程的数量，不等于协议种类的数量</text><text x="700.0" y="1001" class="body" text-anchor="middle">建议先隔离运行，后续确认安全才复用进程；Pi 候选尤其不能直接共用一个活跃连接</text><text x="700.0" y="1027" class="body" text-anchor="middle">本机已有或 Farfold 按需安装，只改变程序来源；Farfold 对外任务通信始终走 ACP</text></svg>
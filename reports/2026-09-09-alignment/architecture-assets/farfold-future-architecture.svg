<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-label="Farfold 未来可能的项目架构"><title>Farfold 未来可能的项目架构</title><desc>概念架构，非排期。已有多 Runtime Host 保留，未来可选增加交接或共享任务协作，并接入独立 LifeModel System。全部新增方向当前暂缓。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#233949} .title{font-size:23px;font-weight:650}.body{font-size:18px;fill:#485c68}.small{font-size:16px;fill:#566975}.group-label{font-size:17px;font-weight:600;letter-spacing:1px}.node rect{fill:#fff;stroke:#9aacb6;stroke-width:1.6}.node.core rect{fill:#edf5f6;stroke:#60858f}.node.runtime rect{fill:#edf1f9;stroke:#778eae}.node.future rect{fill:#fffbf2;stroke:#b78132;stroke-dasharray:7 5}.node.life rect{fill:#f7f2fb;stroke:#977aaf;stroke-dasharray:7 5}.node.frozen rect{fill:#f3f3f0;stroke:#94988e;stroke-dasharray:4 4}.node{cursor:default;outline:none}.node:hover rect,.node:focus rect{stroke:#b55732;stroke-width:3}.edge{fill:none;stroke:#64828d;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#back)}.potential{stroke:#b78132;stroke-dasharray:7 5;marker-end:url(#futureArrow)}.life-edge{stroke:#977aaf;stroke-dasharray:7 5;marker-end:url(#lifeArrow)}.boundary{fill:#fcfdfd;stroke:#bacbd1;stroke-width:1.4}.future-boundary{fill:#fffefa;stroke:#d4b782;stroke-width:1.5;stroke-dasharray:9 6}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64828d"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#64828d"/></marker><marker id="futureArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b78132"/></marker><marker id="lifeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#977aaf"/></marker></defs><rect width="1440" height="1100" fill="#fff"/><text x="70" y="59" class="title" text-anchor="start">未来概念架构</text><text x="70" y="88" class="small" text-anchor="start">暂缓 · 非实施计划</text><rect x="40" y="150" width="990" height="616" rx="18" class="boundary"/><rect x="1070" y="150" width="340" height="616" rx="18" class="future-boundary"/><g class="node core" aria-label="用户掌握目标、授权与选择"><rect x="440" y="28" width="470" height="78" rx="12"/><text x="460" y="61" class="title" style="font-size:23px">用户掌握目标、授权与选择</text><text x="460" y="90" class="body" text-anchor="start">基础工作持续可用 · 增益能力可选</text></g><path d="M675 106 V205" class="edge both"/><text x="60" y="179" class="group-label" text-anchor="start">FARFOLD 可能的演进</text><text x="1087" y="179" class="small" text-anchor="start">独立 LifeModel System · 暂缓集成</text><g class="node core" aria-label="统一个人工作台"><rect x="70" y="205" width="930" height="92" rx="12"/><text x="90" y="238" class="title" style="font-size:23px">统一个人工作台</text><text x="90" y="267" class="body" text-anchor="start">现有项目与会话体验 + 可选的跨 Agent 任务视图</text></g><g class="node future" aria-label="跨 Agent 任务交接"><rect x="70" y="355" width="440" height="100" rx="12"/><text x="90" y="388" class="title" style="font-size:23px">跨 Agent 任务交接</text><text x="90" y="417" class="body" text-anchor="start">目标、来源、成果文件、未完成事项</text></g><g class="node future" aria-label="共享任务空间中的协作"><rect x="560" y="355" width="440" height="100" rx="12"/><text x="580" y="388" class="title" style="font-size:23px">共享任务空间中的协作</text><text x="580" y="417" class="body" text-anchor="start">角色、消息、成果、冲突与终止条件</text></g><path d="M290 297 V355" class="edge potential"/><path d="M780 297 V355" class="edge potential"/><path d="M290 455 V512" class="edge potential"/><path d="M780 455 V512" class="edge potential"/><path d="M70 250 H53 V550 H70" class="edge "/><text x="320" y="490" class="small" text-anchor="start">可选增益；普通工作可直接使用既有 Host</text><g class="node core" aria-label="保留既有 Host 与数据权责"><rect x="70" y="512" width="930" height="92" rx="12"/><text x="90" y="545" class="title" style="font-size:23px">保留既有 Host 
node life" aria-label="更远的系统生态范围"><rect x="1070" y="846" width="340" height="138" rx="12"/><text x="1090" y="879" class="title" style="font-size:23px">更远的系统生态范围</text><text x="1090" y="908" class="body" text-anchor="start">其他授权来源 / 其他应用出口</text><text x="1090" y="934" class="body" text-anchor="start">手机记录、插件、智能设备等</text></g><text x="70" y="1045" class="small" text-anchor="start">虚线模块与链路均为可能方向：用户已明确暂缓；本图仅用于产品与商业材料对齐。</text></svg>
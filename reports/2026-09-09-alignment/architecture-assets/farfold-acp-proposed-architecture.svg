<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1390" role="img" aria-label="Farfold 统一 ACP 候选完整架构，保留新增替换边界"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#617680" stroke-width="1.7"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#243b43}.h{font-size:23px;font-weight:650}.b{font-size:18px}.s{font-size:16px;fill:#536d77}.tiny{font-size:14px;fill:#536d77}</style><rect width="1240" height="1390" fill="#f6f9fa"/><text x="45" y="38" class="h" text-anchor="start">统一 ACP 后：各部分分别负责什么</text><text x="45" y="68" class="s" text-anchor="start">绿色：保留并完善　蓝色：新增公共能力　橙色：替换 / 改造　白色：外部 Agent</text><rect x="45" y="96" width="1100" height="120" rx="13" fill="#eaf4ee" stroke="#91b79f" stroke-width="1.5"/><text x="595.0" y="128" class="h" text-anchor="middle">01 · 自有工作台【保留并完善】</text><text x="595.0" y="160" class="s" text-anchor="middle">共用项目、会话、输入框、消息和状态展示</text><text x="595.0" y="187" class="s" text-anchor="middle">按 Agent 能力显示专属交互；界面仍由 Farfold 实现</text><path d="M595 223L595 267" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="618" y="249" class="s" text-anchor="start">稳定的 Farfold 内部接口</text><text x="45" y="301" class="h" text-anchor="start">02 · 公共 Host 中间层【已有基础 + 补齐管理能力】</text><rect x="45" y="322" width="345" height="214" rx="13" fill="#eaf1fe" stroke="#9bafe0" stroke-width="1.5"/><text x="217.5" y="354" class="h" text-anchor="middle">安装与版本【扩展】</text><text x="217.5" y="386" class="s" text-anchor="middle">本机已有：发现 / 选择 / 记住</text><text x="217.5" y="413" class="s" text-anchor="middle">工作台：按需安装 Agent / 适配器</text><text x="217.5" y="440" class="s" text-anchor="middle">管理版本、依赖、升级与来源</text><text x="217.5" y="467" class="s" text-anchor="middle">主安装包不附带 Agent 本体</text><rect x="422" y="322" width="345" height="214" rx="13" fill="#eaf4ee" stroke="#91b79f" stroke-width="1.5"/><text x="594.5" y="354" class="h" text-anchor="middle">工作与会话【保留并完善】</text><text x="594.5" y="386" class="s" text-anchor="middle">启动 / 停止 / 故障恢复</text><text x="594.5" y="413" class="s" text-anchor="middle">项目与原生 Session 绑定</text><text x="594.5" y="440" class="s" text-anchor="middle">操作状态 / 事件分发 / 诊断</text><text x="594.5" y="467" class="s" text-anchor="middle">Farfold 数据与原生历史分开</text><rect x="799" y="322" width="345" height="214" rx="13" fill="#eaf1fe" stroke="#9bafe0" stroke-width="1.5"/><text x="971.5" y="354" class="h" text-anchor="middle">Provider 配置【单独建设】</text><text x="971.5" y="386" class="s" text-anchor="middle">兼容的模型服务只配置一次</text><text x="971.5" y="413" class="s" text-anchor="middle">按 Agent 官方配置方式应用</text><text x="971.5" y="440" class="s" text-anchor="middle">安全保存凭据引用与授权范围</text><text x="971.5" y="467" class="s" text-anchor="middle">专属账号仍走各自认证</text><path d="M595 543L595 593" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="617" y="571" class="s" text-anchor="start">公共工作操作进入同一条通信路径</text><rect x="45" y="602" width="1100" height="148" rx="13" fill="#eaf1fe" stroke="#9bafe0" stroke-width="1.5"/><text x="595.0" y="634" class="h" text-anchor="middle">03 · 一套公共 ACP 客户端【新增；替换三套直连通信】</text><text x="595.0" y="666" class="s" text-anchor="middle">共用协议 SDK / 请求关联 / 流式事件 / 超时与断开处理</text><text x="595.0" y="693" class="s" text-anchor="middle">握手并读取实际能力；会话、模型选项、权限与提问按支持情况呈现</text><text x="595.0" y="720" class="s" text-anchor="middle">收到什么事件，就按其语义展示；未知扩展留在边界并可诊断</text><rect x="35" y="812" width="1120" height="307" rx="16" fill="none" stroke="#aebfc7" stroke-dasharray="7 5"/><path d="M217 757L217 835" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M595 757L595 835" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M973 757L973 835" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="55" y="844" width="325" height="100" rx="13" fill="#fff2df" stroke="#d4ad71" stroke-width="1.5"/><text x="217.5" y="876" class="h" text-anchor="middle">Pi ACP 适配器【接入】</text><text x="217.5" y="908" class="s" text-anchor="middle">将 ACP 转为 Pi 的原生 RPC</text><path d="M217 951L217 979" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="55" y="988" width="325" height="108" rx="13" fill="#ffffff" stroke="#bac9ce" stroke-width="1.5"/><text x="217.5" y="1020" class="h" text-anchor="middle">Pi 本体【保留】</text><text x="217.5" y="1052" class="s" text-anchor="middle">自己的 Agent 循环和原生会话</text><text x="217.5" y="1079" class="s" text-anchor="middle">本机已有 / 按需安装</text><rect x="432" y="844" width="325" height="252" rx="13" fill="#ffffff" stroke="#bac9ce" stroke-width="1.5"/><text x="594.5" y="876" class="h" text-anchor="middle">OpenCode 本体【保留】</text><text x="594.5" y="908" class="s" text-anchor="middle">使用其原生 ACP 入口</text><text x="594.5" y="935" class="s" text-anchor="middle">Farfold 不再走 HTTP / SSE 直连</text><text x="594.5" y="962" class="s" text-anchor="middle"></text><text x="594.5" y="989" class="s" text-anchor="middle">自己的 Agent 循环和原生会话</text><text x="594.5" y="1016" class="s" text-anchor="middle">本机已有 / 按需安装</text><rect x="810" y="844" width="325" height="100" rx="13" fill="#fff2df" stroke="#d4ad71" stroke-width="1.5"/><text x="972.5" y="876" class="h" text-anchor="middle">Codex ACP 适配器【接入】</text><text x="972.5" y="908" class="s" text-anchor="middle">将 ACP 转为 Codex App Server</text><path d="M973 951L973 979" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="810" y="988" width="325" height="108" rx="13" fill="#ffffff" stroke="#bac9ce" stroke-width="1.5"/><text x="972.5" y="1020" class="h" text-anchor="middle">Codex 本体【保留】</text><text x="972.5" y="1052" class="s" text-anchor="middle">自己的 Agent 循环和原生会话</text><text x="972.5" y="1079" class="s" text-anchor="middle">本机已有 / 按需安装</text><path d="M1148 425H1195V1050H1159" fill="none" stroke="#617680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="1217" y="710" class="tiny" text-anchor="middle" transform="rotate(90 1217 710)">配置侧路：按各 Agent 官方方式应用，不由 ACP 自动共享</text><path d="M217 1124L217 1190" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M595 1124L595 1190" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M973 1124L973 1190" fill="none" stroke="#617680" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="45" y="1199" width="1100" height="92" rx="13" fill="#ffffff" stroke="#bac9ce" stroke-width="1.5"/><text x="595.0" y="1231" class="h" text-anchor="middle">模型服务 / Provider</text><text x="595.0" y="1263" class="s" text-anchor="middle">实际模型请求由 Agent 发出，Farfold 的 ACP 客户端不代替 Agent 调模型</text><text x="45" y="1332" class="s" text-anchor="start">Agent 接入侧优先复用现有实现，不修改 Agent 本体；本机发现不等于接管已打开的终端。</text><text x="45" y="1362" class="s" text-anchor="start">图中适配器为候选接入方式；具体版本、功能覆盖和旧会话恢复规则属于设计待确认项。</text></svg>
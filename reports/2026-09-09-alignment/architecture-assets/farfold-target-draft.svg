<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1210" role="img" aria-labelledby="title desc"><title id="title">Farfold 目标架构对齐草图</title><desc id="desc">共享工作台连接公共中间层，中间层包含安装管理、工作控制和 Provider 配置，各 Agent 通过差异适配与协议客户端连接，最后由 Agent 调用模型服务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#587482" stroke-width="1.6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#203641} .h{font-weight:650;font-size:23px}.b{font-size:17px}.s{font-size:15px;fill:#536b76}</style><rect width="1100" height="1210" fill="#f7fafb"/><rect x="65" y="30" width="970" height="150" rx="15" fill="#e8f3f0" stroke="#83b4a6" stroke-width="1.5"/><text x="95" y="68" class="h" text-anchor="start">01  Farfold 自己的工作台</text><text x="95" y="105" class="b" text-anchor="start">共用界面：项目、会话、输入框、消息展示、状态提示</text><text x="95" y="139" class="b" text-anchor="start">专属交互：按所选 Agent 展示权限、模式、运行中干预等原生能力</text><path d="M550 185L550 225" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="570" y="210" class="s" text-anchor="start">稳定的 Farfold 内部接口</text><rect x="65" y="235" width="970" height="370" rx="15" fill="#edf3fa" stroke="#93aeca" stroke-width="1.5"/><text x="95" y="275" class="h" text-anchor="start">02  公共中间层：把接入和日常工作做扎实</text><rect x="85" y="300" width="290" height="225" rx="15" fill="#fff" stroke="#cad8df" stroke-width="1.5"/><text x="103" y="336" class="h" text-anchor="start">安装与版本管理</text><text x="103" y="374" class="s" text-anchor="start">本机已有：发现、选择、登记</text><text x="103" y="407" class="s" text-anchor="start">没有安装：工作台按需下载</text><text x="103" y="440" class="s" text-anchor="start">检查版本、依赖和必要适配器</text><text x="103" y="473" class="s" text-anchor="start">不兼容：明确原因与升级路径</text><rect x="405" y="300" width="290" height="225" rx="15" fill="#fff" stroke="#cad8df" stroke-width="1.5"/><text x="423" y="336" class="h" text-anchor="start">共同工作机制</text><text x="423" y="374" class="s" text-anchor="start">连接、启动、断开与恢复</text><text x="423" y="407" class="s" text-anchor="start">会话绑定、草稿、任务准入</text><text x="423" y="440" class="s" text-anchor="start">事件分发、操作状态、诊断</text><text x="423" y="473" class="s" text-anchor="start">统一入口，保留原生操作含义</text><rect x="725" y="300" width="290" height="225" rx="15" fill="#fff" stroke="#cad8df" stroke-width="1.5"/><text x="743" y="336" class="h" text-anchor="start">Provider 配置管理</text><text x="743" y="374" class="s" text-anchor="start">兼容的服务尽量只配置一次</text><text x="743" y="407" class="s" text-anchor="start">保存地址、模型和凭据引用</text><text x="743" y="440" class="s" text-anchor="start">按各 Agent 官方方式应用</text><text x="743" y="473" class="s" text-anchor="start">专属账号仍走各自认证</text><text x="95" y="558" class="s" text-anchor="start">保存 Farfold 自己的项目、安装记录与会话引用；凭据采用安全存储</text><text x="95" y="585" class="b" text-anchor="start">两种安装来源进入同一套连接流程；主安装包不携带 Agent 本体</text><path d="M550 610L550 650" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="65" y="660" width="970" height="100" rx="15" fill="#fff7e9" stroke="#d9bd80" stroke-width="1.5"/><text x="550" y="697" class="h" text-anchor="middle">03  一套公共 ACP 客户端</text><text x="550" y="731" class="b" text-anchor="middle">协议握手 · 能力协商 · 会话请求 · 事件与交互 · 已支持的扩展</text><path d="M230 765L230 798" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M550 765L550 798" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M870 765L870 798" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="85" y="808" width="290" height="90" rx="15" fill="#fff7e9" stroke="#d9bd80" stroke-width="1.5"/><text x="230" y="843" class="b" text-anchor="middle">Pi ACP 适配器</text><text x="230" y="878" class="s" text-anchor="middle">由适配器连接 Pi</text><path d="M230 902L230 918" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="405" y="808" width="290" height="90" rx="15" fill="#fff7e9" stroke="#d9bd80" stroke-width="1.5"/><text x="550" y="843" class="b" text-anchor="middle">OpenCode 原生 ACP</text><text x="550" y="878" class="s" text-anchor="middle">Agent 自己提供 ACP 接口</text><path d="M550 902L550 918" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="725" y="808" width="290" height="90" rx="15" fill="#fff7e9" stroke="#d9bd80" stroke-width="1.5"/><text x="870" y="843" class="b" text-anchor="middle">Codex ACP 适配器</text><text x="870" y="878" class="s" text-anchor="middle">由适配器连接 Codex</text><path d="M870 902L870 918" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="85" y="923" width="290" height="85" rx="15" fill="#fff" stroke="#8f9fa9" stroke-width="1.5"/><text x="230" y="958" class="h" text-anchor="middle">Pi 进程</text><text x="230" y="985" class="s" text-anchor="middle">来自本机安装或 Farfold 按需安装</text><path d="M230 1013L230 1065" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="405" y="923" width="290" height="85" rx="15" fill="#fff" stroke="#8f9fa9" stroke-width="1.5"/><text x="550" y="958" class="h" text-anchor="middle">OpenCode 进程</text><text x="550" y="985" class="s" text-anchor="middle">来自本机安装或 Farfold 按需安装</text><path d="M550 1013L550 1065" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="725" y="923" width="290" height="85" rx="15" fill="#fff" stroke="#8f9fa9" stroke-width="1.5"/><text x="870" y="958" class="h" text-anchor="middle">Codex 进程</text><text x="870" y="985" class="s" text-anchor="middle">来自本机安装或 Farfold 按需安装</text><path d="M870 1013L870 1065" fill="none" stroke="#587482" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="65" y="1075" width="970" height="90" rx="15" fill="#e8f3f0" stroke="#83b4a6" stroke-width="1.5"/><text x="550" y="1112" class="h" text-anchor="middle">模型服务 / Provider</text><text x="550" y="1143" class="b" text-anchor="middle">实际模型请求由各 Agent 发出；只对兼容的 Agent 复用配置</text><text x="550" y="1195" class="s" text-anchor="middle">目标统一走 ACP；优先复用现有适配器。具体版本与能力覆盖仍需迁移前验证。</text></svg>
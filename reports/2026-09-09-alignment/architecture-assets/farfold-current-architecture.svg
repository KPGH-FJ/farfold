<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" role="img" aria-label="Farfold 当前架构"><title>Farfold 当前架构</title><desc>当前三 Runtime 架构。Farfold 拥有界面和 Host，Pi、OpenCode、Codex 保留独立执行循环和原生会话。LifeModel 原型冻结且可选。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#233949} .title{font-size:23px;font-weight:650}.body{font-size:18px;fill:#485c68}.small{font-size:16px;fill:#566975}.group-label{font-size:17px;font-weight:600;letter-spacing:1px}.node rect{fill:#fff;stroke:#9aacb6;stroke-width:1.6}.node.core rect{fill:#edf5f6;stroke:#60858f}.node.runtime rect{fill:#edf1f9;stroke:#778eae}.node.future rect{fill:#fffbf2;stroke:#b78132;stroke-dasharray:7 5}.node.life rect{fill:#f7f2fb;stroke:#977aaf;stroke-dasharray:7 5}.node.frozen rect{fill:#f3f3f0;stroke:#94988e;stroke-dasharray:4 4}.node{cursor:default;outline:none}.node:hover rect,.node:focus rect{stroke:#b55732;stroke-width:3}.edge{fill:none;stroke:#64828d;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#back)}.potential{stroke:#b78132;stroke-dasharray:7 5;marker-end:url(#futureArrow)}.life-edge{stroke:#977aaf;stroke-dasharray:7 5;marker-end:url(#lifeArrow)}.boundary{fill:#fcfdfd;stroke:#bacbd1;stroke-width:1.4}.future-boundary{fill:#fffefa;stroke:#d4b782;stroke-width:1.5;stroke-dasharray:9 6}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64828d"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#64828d"/></marker><marker id="futureArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b78132"/></marker><marker id="lifeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#977aaf"/></marker></defs><rect width="1440" height="1040" fill="#fff"/><text x="70" y="63" class="title" text-anchor="start">当前三 Runtime 架构</text><text x="70" y="91" class="small" text-anchor="start">Farfold · 2026-09-09</text><rect x="40" y="150" width="990" height="522" rx="18" class="boundary"/><text x="60" y="178" class="group-label" text-anchor="start">FARFOLD 拥有的桌面产品</text><g class="node core" aria-label="用户与真实项目"><rect x="440" y="32" width="470" height="78" rx="12"/><text x="460" y="65" class="title" style="font-size:23px">用户与真实项目</text><text x="460" y="94" class="body" text-anchor="start">选择 Agent、发起任务、审批与干预</text></g><path d="M675 110 V200" class="edge both"/><text x="695" y="139" class="small" text-anchor="start">输入 / 进展 / 结果</text><g class="node core" aria-label="统一 Farfold 工作台"><rect x="70" y="200" width="930" height="100" rx="12"/><text x="90" y="233" class="title" style="font-size:23px">统一 Farfold 工作台</text><text x="90" y="262" class="body" text-anchor="start">React 19 + TypeScript · Tauri 2 macOS 外壳</text><text x="90" y="288" class="body" text-anchor="start">项目与会话导航、模型选择、输入、工具过程、原生交互与恢复</text></g><path d="M535 300 V351" class="edge both"/><text x="555" y="332" class="small" text-anchor="start">类型化 Tauri 命令与事件</text><g class="node core" aria-label="Rust Host 公共机制"><rect x="70" y="351" width="930" height="130" rx="12"/><text x="90" y="384" class="title" style="font-size:23px">Rust Host 公共机制</text><text x="90" y="413" class="body" text-anchor="start">安装与连接身份 · 会话绑定 · 自有进程生命周期</text><text x="90" y="439" class="body" text-anchor="start">任务准入与目录排他 · 事件分发与缺口处理 · 原生交互登记 · 恢复</text></g><path d="M1000 410 H1090" class="edge both"/><g class="node core" aria-label="Farfold 本地 SQLite"><rect x="1090" y="351" width="310" height="130" rx="12"/><text x="1110" y="384" class="title" style="font-size:23px">Farfold 本地 SQLite</text><text x="1110" y="413" class="body" text-anchor="start">Host schema 8</text><text x="1110" y="439" class="body" text-anchor="start">项目、草稿、会话与程序引用</text></g><g class="node frozen" aria-label="LifeModel 最简原型"><rect x="1090" y="200" width="310" height="100" rx="12"/><text x="1110" y="233" class="title" style="font-size:23px">LifeModel 最简原型</text><text x="1110" y="262" class="body" text-anchor="start">可选 · 默认关闭 · 功能冻结</text></g><path d="M1000 249 H1090" class="edge life-edge"/><text x="1070" y="315" class="small" text-anchor="middle">可选入口，独立于基础工作</text><path d="M220 481 V545" class="edge both"/><g class="node " aria-label="Pi 适配器"><rect x="70" y="545" width="290" height="92" rx="12"/><text x="90" y="578" class="title" style="font-size:23px">Pi 适配器</text><text x="90" y="607" class="body" text-anchor="start">RPC + 同版本能力桥接</text></g><path d="M540 481 V545" class="edge both"/><g class="node " aria-label="OpenCode 适配器"><rect x="390" y="545" width="290" height="92" rx="12"/><text x="410" y="578" class="title" style="font-size:23px">OpenCode 适配器</text><text x="410" y="607" class="body" text-anchor="start">HTTP 命令 + SSE 事件</text></g><path d="M860 481 V545" class="edge both"/><g class="node " aria-label="Codex 适配器"><rect x="710" y="545" width="290" height="92" rx="12"/><text x="730" y="578" class="title" style="font-size:23px">Codex 适配器</text><text x="730" y="607" class="body" text-anchor="start">自有 stdio App Server</text></g><text x="1090" y="527" class="group-label" text-anchor="start">身份与数据边界</text><text x="1090" y="561" class="body" text-anchor="start">每个会话固定绑定一条连接</text><text x="1090" y="587" class="body" text-anchor="start">和一个 Runtime 原生会话</text><text x="1090" y="623" class="body" text-anchor="start">切换 Agent 会进入另一会话</text><text x="1090" y="649" class="body" text-anchor="start">不迁移不透明的内部状态</text><text x="1090" y="695" class="group-label" text-anchor="start">官方接口边界</text><text x="1090" y="726" class="small" text-anchor="start">向下发命令 / 向上返原生事件</text><path d="M215 637 V776" class="edge both"/><text x="230" y="749" class="small" text-anchor="start">JSONL RPC / stdio</text><path d="M535 637 V776" class="edge both"/><text x="550" y="749" class="small" text-anchor="start">HTTP / SSE</text><path d="M855 637 V776" class="edge both"/><text x="870" y="749" class="small" text-anchor="start">JSON-RPC / stdio</text><g class="node runtime" aria-label="Pi 0.84.3"><rect x="70" y="776" width="290" height="100" rx="12"/><text x="90" y="809" class="title" style="font-size:23px">Pi 0.84.3</text><text x="90" y="838" class="body" text-anchor="start">随应用提供 · 摘要固定</text></g><g class="node runtime" aria-label="OpenCode 1.15.13"><rect x="390" y="776" width="290" height="100" rx="12"/><text x="410" y="809" class="title" style="font-size:23px">OpenCode 1.15.13</text><text x="410" y="838" class="body" text-anchor="start">随应用提供 · 摘要固定</text></g><g class="node runtime" aria-label="Codex CLI 0.143.0"><rect x="710" y="776" width="290" height="100" rx="12"/><text x="730" y="809" class="title" style="font-size:23px">Codex CLI 0.143.0</text><text x="730" y="838" class="body" text-anchor="start">用户程序 · 验证路径与摘要</text></g><text x="70" y="919" class="body" text-anchor="start">各 Runtime 自己拥有 Agent loop、原生 Session、Provider / 模型、工具、权限、Skills 与工作记忆。</text><text x="70" y="954" class="body" text-anchor="start">Farfold 连接并呈现这些能力；不修改 Runtime，不另建 Agent 执行循环。</text><g class="node runtime" aria-label="Runtime 数据与真实工作"><rect x="1090" y="776" width="310" height="162" rx="12"/><text x="1110" y="809" class="title" style="font-size:23px">Runtime 数据与真实工作</text><text x="1110" y="838" class="body" text-anchor="start">原生会话历史与认证</text><text x="1110" y="864" class="body" text-anchor="start">模型服务 / 本地模型</text><text x="1110" y="890" class="body" text-anchor="start">用户项目中的实际文件</text></g><path d="M215 876 V889 H1045 V825 H1090" class="edge "/><path d="M535 876 V889" class="edge "/><path d="M855 876 V889" class="edge "/><text x="70" y="1009" class="small" text-anchor="start">范围说明：逻辑架构图；框不代表独立服务。三路是平级选择，并发不等于协作。</text></svg>
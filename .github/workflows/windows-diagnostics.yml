          Get-Content -LiteralPath (Join-Path $raw 'aggregate.json')
          if (-not $complete) { exit 1 }
      - name: Keep selected diagnostic raw logs and outcomes
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-diagnostics-raw/
          if-no-files-found: error
          retention-days: 7

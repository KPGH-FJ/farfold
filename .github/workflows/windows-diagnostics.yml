          [ordered]@{ head = $head; test = 'pty::windows_tests::terminal_master_drop_retains_bounded_unknown_isolated'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactOneFailed = $exactFailure; testPassed = $false; observationComplete = $complete; innerReceipt18 = $inner; ownerReceipt17 = $owner; classification = if ($complete) { 'boundedUnknownRetained_deadlineOwnerReaped_notTestPass' } else { 'incompleteOrDifferentFailure' }; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'master-unknown.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          # The controlled negative remains an actual failed test and failed step.

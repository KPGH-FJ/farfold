            if ($null -eq $cell.executor_error -and ($null -eq $cell.stdout_bytes -or $cell.returned_code -ne $owner.owned_wrapper_exit)) { $valid = $false }
            if ($null -ne $cell.executor_error -and ($null -ne $cell.stdout_bytes -or $null -ne $cell.returned_code)) { $valid = $false }
            if ($null -ne $cell.stdout_bytes -and $cell.stdout_bytes -gt 4194304) { $valid = $false }
            if (-not $valid) { $complete = $false }
            $index++
          } } } }
          $inputsStable = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -eq $selection.testBinarySha256 -and (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -eq $selection.fixtureSha256
          $complete = $complete -and $index -eq 8 -and $inputsStable
          [ordered]@{
            head = $head; test = $test; startedAtUtc = $started; finishedAtUtc = $finished
            exitCode = $testExit; summaryCount = $summaries.Count; finalSummary = if ($last) { $last.Value } else { $null }
            oneObservationTestPassed = $oneObservationTestPassed; diagnosticObservationComplete = $complete
            matrix = $matrix; inputsStable = $inputsStable; existingLaunchFailureFixed = $false
            readContextAdmissionProven = $false; productOrAllWindowsComplete = $false
            stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash
            stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $raw 'git-launch-matrix.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $complete) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Require selected positives and strict retained-master negative observation
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          New-Item -ItemType Directory -Path $raw -Force | Out-Null
          $build = '${{ steps.selected_build.outcome }}'
          $required = [ordered]@{
            cursor_parser = '${{ steps.cursor_parser.outcome }}'
            publication = '${{ steps.publication.outcome }}'
            publication_names = '${{ steps.publication_names.outcome }}'
            terminal_reply = '${{ steps.terminal_reply.outcome }}'
            terminal_cancel = '${{ steps.terminal_cancel.outcome }}'
            auth_reservation = '${{ steps.auth_reservation.outcome }}'
            auth_cancellation = '${{ steps.auth_cancellation.outcome }}'
            ads_named = '${{ steps.ads_named.outcome }}'
            sdk_paths = '${{ steps.sdk_paths.outcome }}'
            selected_material = '${{ steps.selected_material.outcome }}'
            owned_input_artifacts = '${{ steps.owned_input_artifacts.outcome }}'
            owned_recovery_material = '${{ steps.owned_recovery_material.outcome }}'
            owned_bundle_offline = '${{ steps.owned_bundle_offline.outcome }}'
            carrier_portable = '${{ steps.carrier_portable.outcome }}'
            carrier_full_sd = '${{ steps.carrier_full_sd.outcome }}'
          }
          $positivesPassed = $build -eq 'success'
          foreach ($outcome in $required.Values) { if ($outcome -ne 'success') { $positivesPassed = $false } }
          $negativeOutcome = '${{ steps.master_unknown.outcome }}'
          $negativePath = Join-Path $raw 'master-unknown.result.json'
          $negative = if (Test-Path -LiteralPath $negativePath -PathType Leaf) { Get-Content -LiteralPath $negativePath -Raw | ConvertFrom-Json -ErrorAction Stop } else { $null }
          $negativeComplete = $null -ne $negative -and $negativeOutcome -ceq 'failure' -and $negative.head -ceq '${{ github.sha }}' -and $negative.test -ceq 'pty::windows_tests::terminal_master_drop_retains_bounded_unknown_isolated' -and $negative.exitCode -eq 101 -and $negative.exactOneFailed -eq $true -and $negative.testPassed -eq $false -and $negative.observationComplete -eq $true
          $complete = $positivesPassed -and $negativeComplete
          [ordered]@{
            sourceHead = '${{ github.sha }}'
            buildOutcome = $build
            requiredPositiveStepOutcomes = $required
            masterUnknownStepOutcome = $negativeOutcome
            masterUnknownTestExit = if ($negative) { $negative.exitCode } else { $null }
            masterUnknownTestPassed = $false
            masterUnknownFinalSummary = if ($negative) { $negative.finalSummary } else { $null }
            masterUnknownObservationComplete = $negativeComplete
            diagnosticsComplete = $complete
            notExecutedBecauseBuildFailed = $build -ne 'success'
            productOrAllWindowsComplete = $false
            scope = 'selected parser/publication/terminal/auth/partialADS/SDK- controls only; expected master negative101 remains failed test+step; cancelled/skipped/missing/IOerror/mixedowner/earlypanic are incomplete'
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'aggregate.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $raw 'aggregate.json')
          if (-not $complete) { exit 1 }
      - name: Keep selected diagnostic raw logs and outcomes
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-diagnostics-raw/
          if-no-files-found: error
          retention-days: 7

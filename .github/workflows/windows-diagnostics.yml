          $stderr = Join-Path $raw 'master-unknown.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'pty::windows_tests::terminal_master_drop_retains_bounded_unknown_isolated' --ignored --exact --nocapture --test-threads=1 1> $stdout 2> $stderr

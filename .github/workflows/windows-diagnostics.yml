          $ownerReceipts = @($lines | Where-Object { $_.StartsWith($ownerPrefix, [StringComparison]::Ordinal) } | ForEach-Object { $_.Substring($ownerPrefix.Length) | ConvertFrom-Json -AsHashtable -ErrorAction Stop })

          $ownerKeys = @('case') + $ownerYes + $ownerNo
          $validOwner = $null -ne $owner -and $owner.case -ceq 'TerminalMasterBoundedUnknown' -and ((@($owner.Keys | Sort-Object) -join ',') -ceq (@($ownerKeys | Sort-Object) -join ','))
          if ($validOwner) {
            foreach ($key in $ownerYes + $ownerNo) { if ($owner[$key] -isnot [bool]) { $validOwner = $false } }
            foreach ($key in $ownerYes) { if ($owner[$key] -ne $true) { $validOwner = $false } }
            foreach ($key in $ownerNo) { if ($owner[$key] -ne $false) { $validOwner = $false } }
          }
          $begin = @($lines | Where-Object { $_ -ceq 'FARFOLD_CONPTY_BEGIN TerminalMasterBoundedUnknown' }).Count -eq 1
          $park = @($lines | Where-Object { $_ -ceq 'FARFOLD_TERMINAL_BOUNDED_UNKNOWN_PARK TerminalMasterBoundedUnknown' }).Count -eq 1

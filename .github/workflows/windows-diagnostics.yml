name: Windows selected diagnostics

# Manual, selected synthetic diagnostics only. This does not replace Windows
# verification, run all Rust tests, build an installer, or prove Agent readiness.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check synthetic protocol fixture interpreter
        timeout-minutes: 2
        run: |
          $fixturePython = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          & $fixturePython -c "import sys; assert sys.version_info >= (3, 9); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build selected test binary and owned process fixture without running tests
        id: selected_build
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          New-Item -ItemType Directory -Path $raw -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}') { throw 'Checked out head does not match the single dispatched head' }
          [ordered]@{ head = $head; runId = '${{ github.run_id }}'; runAttempt = '${{ github.run_attempt }}'; scope = 'selected parser/publication/originalTerminalCancel/auth2/partialADS positives plus strict master-retirement bounded-unknown negative only' } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $raw 'identity.json') -Encoding utf8
          & cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run --message-format=json 1> (Join-Path $raw 'test-build.stdout.jsonl') 2> (Join-Path $raw 'test-build.stderr.log')
          $testBuildExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $raw 'test-build.stderr.log')
          if ($testBuildExit -ne 0) { exit $testBuildExit }
          $executables = @(Get-Content -LiteralPath (Join-Path $raw 'test-build.stdout.jsonl') | ForEach-Object {
            $message = $_ | ConvertFrom-Json -AsHashtable -ErrorAction Stop
            if ($message.reason -eq 'compiler-artifact' -and $message.target.name -eq 'farfold_lib' -and $message.profile.test -eq $true -and $message.executable) { $message.executable }
          } | Select-Object -Unique)
          if ($executables.Count -ne 1) { throw 'Expected exactly one built farfold_lib test executable' }
          $binary = (Resolve-Path -LiteralPath $executables[0] -ErrorAction Stop).Path
          $deps = [IO.Path]::GetFullPath((Join-Path $PWD 'src-tauri/target/debug/deps')) + [IO.Path]::DirectorySeparatorChar
          if (-not $binary.StartsWith($deps, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetExtension($binary) -ne '.exe') { throw 'Unexpected test executable location' }
          & cargo build --manifest-path src-tauri/Cargo.toml --locked --example windows_process_fixture 1> (Join-Path $raw 'fixture-build.stdout.log') 2> (Join-Path $raw 'fixture-build.stderr.log')
          $fixtureBuildExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $raw 'fixture-build.stdout.log')
          Get-Content -LiteralPath (Join-Path $raw 'fixture-build.stderr.log')
          if ($fixtureBuildExit -ne 0) { exit $fixtureBuildExit }
          $fixture = (Resolve-Path -LiteralPath 'src-tauri/target/debug/examples/windows_process_fixture.exe' -ErrorAction Stop).Path
          [ordered]@{
            sourceHead = $head
            testBinary = $binary
            testBinarySha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
            fixture = $fixture
            fixtureSha256 = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
            testBuildExit = $testBuildExit
            fixtureBuildExit = $fixtureBuildExit
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Encoding utf8
      - name: Cursor parser controls, exactly three tests
        id: cursor_parser
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}' -or $selection.sourceHead -ne $head) { throw 'Diagnostic head changed after build' }
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          $fixture = (Resolve-Path -LiteralPath $selection.fixture -ErrorAction Stop).Path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256 -or (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $selection.fixtureSha256) { throw 'Built diagnostic inputs changed' }
          $stdout = Join-Path $raw 'cursor-parser.stdout.log'
          $stderr = Join-Path $raw 'cursor-parser.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'pty::windows_tests::terminal_cursor_query_' --nocapture --test-threads=1 1> $stdout 2> $stderr
          $testExit = $LASTEXITCODE
          $finished = [DateTime]::UtcNow.ToString('o')
          $summaries = [regex]::Matches([IO.File]::ReadAllText($stdout), '(?m)^test result: (?<status>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          $last = if ($summaries.Count -gt 0) { $summaries[$summaries.Count - 1] } else { $null }
          $exactSuccess = $testExit -eq 0 -and $summaries.Count -eq 1 -and $null -ne $last -and $last.Groups['status'].Value -eq 'ok' -and $last.Groups['passed'].Value -eq '3' -and $last.Groups['failed'].Value -eq '0' -and $last.Groups['ignored'].Value -eq '0'
          [ordered]@{ head = $head; filter = 'pty::windows_tests::terminal_cursor_query_'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactThreePassed = $exactSuccess; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $raw 'cursor-parser.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $exactSuccess) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Canonical production publication and collision, one exact test
        id: publication
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}' -or $selection.sourceHead -ne $head) { throw 'Diagnostic head changed after build' }
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          $fixture = (Resolve-Path -LiteralPath $selection.fixture -ErrorAction Stop).Path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256 -or (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $selection.fixtureSha256) { throw 'Built diagnostic inputs changed' }
          $stdout = Join-Path $raw 'publication.stdout.log'
          $stderr = Join-Path $raw 'publication.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'file_access::windows::metadata::ci5_native_phase_tests::ci5_canonical_exact_create_sync_publish_reopen_and_collision_phases' --exact --nocapture --test-threads=1 1> $stdout 2> $stderr
          $testExit = $LASTEXITCODE
          $finished = [DateTime]::UtcNow.ToString('o')
          $outText = [IO.File]::ReadAllText($stdout)
          $errText = [IO.File]::ReadAllText($stderr)
          $summaries = [regex]::Matches($outText, '(?m)^test result: (?<status>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          $last = if ($summaries.Count -gt 0) { $summaries[$summaries.Count - 1] } else { $null }
          $exactSuccess = $testExit -eq 0 -and $null -ne $last -and $last.Groups['status'].Value -eq 'ok' -and $last.Groups['passed'].Value -eq '1' -and $last.Groups['failed'].Value -eq '0' -and $last.Groups['ignored'].Value -eq '0'
          $exactFailure = $testExit -eq 101 -and $null -ne $last -and $last.Groups['status'].Value -eq 'FAILED' -and $last.Groups['passed'].Value -eq '0' -and $last.Groups['failed'].Value -eq '1' -and $last.Groups['ignored'].Value -eq '0'
          $cursorPhases = @()
          $cursorCovered = $false
          $observationComplete = $exactSuccess
          $failureClassification = $null
          $ownerReceipt = $null
          $ownerSettled = $false
          $ownerNoOtherCause = $false
          [ordered]@{ head = $head; test = 'file_access::windows::metadata::ci5_native_phase_tests::ci5_canonical_exact_create_sync_publish_reopen_and_collision_phases'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactOnePassed = $exactSuccess; exactOneFailed = $exactFailure; cursorCovered = $cursorCovered; observationComplete = $observationComplete; failureClassification = $failureClassification; ownerReceipt = $ownerReceipt; ownerSettled = $ownerSettled; phases = $cursorPhases; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'publication.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $observationComplete) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Unicode and maximum leaf production publication, one exact test
        id: publication_names
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}' -or $selection.sourceHead -ne $head) { throw 'Diagnostic head changed after build' }
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          $fixture = (Resolve-Path -LiteralPath $selection.fixture -ErrorAction Stop).Path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256 -or (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $selection.fixtureSha256) { throw 'Built diagnostic inputs changed' }
          $stdout = Join-Path $raw 'publication-names.stdout.log'
          $stderr = Join-Path $raw 'publication-names.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'file_access::windows::tests::publication_preserves_unicode_and_maximum_leaf_identity_and_collision' --exact --nocapture --test-threads=1 1> $stdout 2> $stderr
          $testExit = $LASTEXITCODE
          $finished = [DateTime]::UtcNow.ToString('o')
          $outText = [IO.File]::ReadAllText($stdout)
          $errText = [IO.File]::ReadAllText($stderr)
          $summaries = [regex]::Matches($outText, '(?m)^test result: (?<status>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          $last = if ($summaries.Count -gt 0) { $summaries[$summaries.Count - 1] } else { $null }
          $exactSuccess = $testExit -eq 0 -and $null -ne $last -and $last.Groups['status'].Value -eq 'ok' -and $last.Groups['passed'].Value -eq '1' -and $last.Groups['failed'].Value -eq '0' -and $last.Groups['ignored'].Value -eq '0'
          $exactFailure = $testExit -eq 101 -and $null -ne $last -and $last.Groups['status'].Value -eq 'FAILED' -and $last.Groups['passed'].Value -eq '0' -and $last.Groups['failed'].Value -eq '1' -and $last.Groups['ignored'].Value -eq '0'
          $cursorPhases = @()
          $cursorCovered = $false
          $observationComplete = $exactSuccess
          $failureClassification = $null
          $ownerReceipt = $null
          $ownerSettled = $false
          $ownerNoOtherCause = $false
          [ordered]@{ head = $head; test = 'file_access::windows::tests::publication_preserves_unicode_and_maximum_leaf_identity_and_collision'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactOnePassed = $exactSuccess; exactOneFailed = $exactFailure; cursorCovered = $cursorCovered; observationComplete = $observationComplete; failureClassification = $failureClassification; ownerReceipt = $ownerReceipt; ownerSettled = $ownerSettled; phases = $cursorPhases; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'publication-names.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $observationComplete) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Cursor reply arm, one manual exact owned wrapper
        id: terminal_reply
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}' -or $selection.sourceHead -ne $head) { throw 'Diagnostic head changed after build' }
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          $fixture = (Resolve-Path -LiteralPath $selection.fixture -ErrorAction Stop).Path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256 -or (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $selection.fixtureSha256) { throw 'Built diagnostic inputs changed' }
          $stdout = Join-Path $raw 'terminal-reply.stdout.log'
          $stderr = Join-Path $raw 'terminal-reply.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'pty::windows_tests::terminal_cancel_cursor_reply_isolated' --ignored --exact --nocapture --test-threads=1 1> $stdout 2> $stderr
          $testExit = $LASTEXITCODE
          $finished = [DateTime]::UtcNow.ToString('o')
          $outText = [IO.File]::ReadAllText($stdout)
          $errText = [IO.File]::ReadAllText($stderr)
          $summaries = [regex]::Matches($outText, '(?m)^test result: (?<status>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          $last = if ($summaries.Count -gt 0) { $summaries[$summaries.Count - 1] } else { $null }
          $exactSuccess = $testExit -eq 0 -and $null -ne $last -and $last.Groups['status'].Value -eq 'ok' -and $last.Groups['passed'].Value -eq '1' -and $last.Groups['failed'].Value -eq '0' -and $last.Groups['ignored'].Value -eq '0'
          $exactFailure = $testExit -eq 101 -and $null -ne $last -and $last.Groups['status'].Value -eq 'FAILED' -and $last.Groups['passed'].Value -eq '0' -and $last.Groups['failed'].Value -eq '1' -and $last.Groups['ignored'].Value -eq '0'
          $cursorPhases = @()
          $cursorCovered = $false
          $observationComplete = $exactSuccess
          $failureClassification = $null
          $ownerReceipt = $null
          $ownerSettled = $false
          $ownerNoOtherCause = $false
          $cursorPrefix = 'FARFOLD_TERMINAL_CURSOR '
          $cursorPhases = @($errText -split "`r?`n" | Where-Object { $_.StartsWith($cursorPrefix, [StringComparison]::Ordinal) } | ForEach-Object { $_.Substring($cursorPrefix.Length) | ConvertFrom-Json -ErrorAction Stop })
          $beginSeen = ($errText -split "`r?`n") -ccontains 'FARFOLD_CONPTY_BEGIN TerminalCursorReply'
          $validPhases = $beginSeen -and $cursorPhases.Count -gt 0 -and $cursorPhases.Count -le 64
          foreach ($phase in $cursorPhases) {
            if ($phase.replyEnabled -ne $true -or $phase.bytes -lt 0 -or $phase.bytes -gt 1048576 -or $phase.queries -lt 0 -or $phase.queries -gt 8 -or $phase.replies -lt 0 -or $phase.replies -gt $phase.queries -or $phase.pending -lt 0 -or $phase.pending -gt 8 -or $phase.failed -ne $false) { $validPhases = $false }
          }
          $lastPhase = if ($cursorPhases.Count -gt 0) { $cursorPhases[$cursorPhases.Count - 1] } else { $null }
          $spawnReturned = @($cursorPhases | Where-Object { $_.phase -ceq 'spawn.return' }).Count -eq 1
          $cursorCovered = $validPhases -and $null -ne $lastPhase -and $lastPhase.queries -gt 0 -and $lastPhase.cursorCoverage -ceq 'observed'
          $ownerPrefix = 'FARFOLD_CONPTY_DIAGNOSTIC_OWNER '
          $ownerReceipts = @($errText -split "`r?`n" | Where-Object { $_.StartsWith($ownerPrefix, [StringComparison]::Ordinal) } | ForEach-Object { $_.Substring($ownerPrefix.Length) | ConvertFrom-Json -AsHashtable -ErrorAction Stop })
          if ($ownerReceipts.Count -eq 1) { $ownerReceipt = $ownerReceipts[0] }
          $ownerKeys = @('case','terminated','deadlineReached','cancelRequested','invalidPipeObserved','inputFailedObserved','tryWaitErrorObserved','stdinWrittenAndClosed','stdoutEOF','stderrEOF','stdoutFailed','stderrFailed','stdoutOverflow','stderrOverflow','childReaped','directJobInactive')
          $actualOwnerKeys = if ($ownerReceipt) { @($ownerReceipt.Keys | Sort-Object) -join ',' } else { '' }
          $validOwner = $null -ne $ownerReceipt -and $ownerReceipt.case -ceq 'TerminalCursorReply' -and $actualOwnerKeys -ceq (@($ownerKeys | Sort-Object) -join ',')
          if ($validOwner) {
            foreach ($key in $ownerKeys) { if ($key -cne 'case' -and $ownerReceipt[$key] -isnot [bool]) { $validOwner = $false } }
          }
          $ownerSettled = $validOwner -and $ownerReceipt.childReaped -eq $true -and $ownerReceipt.directJobInactive -eq $true -and $ownerReceipt.stdinWrittenAndClosed -eq $true -and $ownerReceipt.stdoutEOF -eq $true -and $ownerReceipt.stderrEOF -eq $true -and $ownerReceipt.stdoutFailed -eq $false -and $ownerReceipt.stderrFailed -eq $false -and $ownerReceipt.stdoutOverflow -eq $false -and $ownerReceipt.stderrOverflow -eq $false
          $ownerNoOtherCause = $validOwner -and $ownerReceipt.cancelRequested -eq $false -and $ownerReceipt.invalidPipeObserved -eq $false -and $ownerReceipt.inputFailedObserved -eq $false -and $ownerReceipt.tryWaitErrorObserved -eq $false
          $observationComplete = $exactSuccess -and $ownerSettled -and $ownerNoOtherCause -and $ownerReceipt.terminated -eq $false -and $ownerReceipt.deadlineReached -eq $false -and $cursorCovered -and $lastPhase.replies -eq $lastPhase.queries -and $lastPhase.pending -eq 0 -and $lastPhase.phase -ceq 'manager.drop.return' -and @($cursorPhases | Where-Object { $_.phase -ceq 'marker.wait.observed' }).Count -eq 1
          [ordered]@{ head = $head; test = 'pty::windows_tests::terminal_cancel_cursor_reply_isolated'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactOnePassed = $exactSuccess; exactOneFailed = $exactFailure; cursorCovered = $cursorCovered; observationComplete = $observationComplete; failureClassification = $failureClassification; ownerReceipt = $ownerReceipt; ownerSettled = $ownerSettled; phases = $cursorPhases; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'terminal-reply.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $observationComplete) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Original terminal cancellation with legal cursor consumer, one exact owned wrapper
        id: terminal_cancel
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ github.sha }}' -or $selection.sourceHead -ne $head) { throw 'Diagnostic head changed after build' }
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          $fixture = (Resolve-Path -LiteralPath $selection.fixture -ErrorAction Stop).Path
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256 -or (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $selection.fixtureSha256) { throw 'Built diagnostic inputs changed' }
          $stdout = Join-Path $raw 'terminal_cancel.stdout.log'
          $stderr = Join-Path $raw 'terminal_cancel.stderr.log'
          $started = [DateTime]::UtcNow.ToString('o')
          & $binary 'pty::windows_tests::cancelling_a_windows_terminal_confirms_job_end_without_an_agent_isolated' --exact --nocapture --test-threads=1 1> $stdout 2> $stderr
          $testExit = $LASTEXITCODE
          $finished = [DateTime]::UtcNow.ToString('o')
          $outText = [IO.File]::ReadAllText($stdout)
          $errText = [IO.File]::ReadAllText($stderr)
          $summaries = [regex]::Matches($outText, '(?m)^test result: (?<status>ok|FAILED)\. (?<passed>\d+) passed; (?<failed>\d+) failed; (?<ignored>\d+) ignored;')
          $last = if ($summaries.Count -gt 0) { $summaries[$summaries.Count - 1] } else { $null }
          $exactSuccess = $testExit -eq 0 -and $null -ne $last -and $last.Groups['status'].Value -eq 'ok' -and $last.Groups['passed'].Value -eq '1' -and $last.Groups['failed'].Value -eq '0' -and $last.Groups['ignored'].Value -eq '0'
          $phases = @()
          $fixtureSettled = $true
          $prefix = 'FARFOLD_TERMINAL_CURSOR '
          $phases = @($errText -split "`r?`n" | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) } | ForEach-Object { $_.Substring($prefix.Length) | ConvertFrom-Json -ErrorAction Stop })
          $finishedPhases = @($phases | Where-Object { $_.phase -ceq 'original-positive.fixture.complete' })
          $fixtureSettled = $finishedPhases.Count -eq 1
          if ($fixtureSettled) {
            $p = $finishedPhases[0]
            $fixtureSettled = $p.replyEnabled -eq $true -and $p.failed -eq $false -and $p.bytes -ge 0 -and $p.bytes -le 1048576 -and $p.queries -ge 0 -and $p.queries -le 8 -and $p.replies -eq $p.queries -and $p.pending -eq 0
          }
          $complete = $exactSuccess -and $fixtureSettled
          [ordered]@{ head = $head; test = 'pty::windows_tests::cancelling_a_windows_terminal_confirms_job_end_without_an_agent_isolated'; startedAtUtc = $started; finishedAtUtc = $finished; exitCode = $testExit; finalSummary = if ($last) { $last.Value } else { $null }; exactOnePassed = $exactSuccess; fixtureSettled = $fixtureSettled; observationComplete = $complete; cursorPhases = $phases; stdoutSha256 = (Get-FileHash -LiteralPath $stdout -Algorithm SHA256).Hash; stderrSha256 = (Get-FileHash -LiteralPath $stderr -Algorithm SHA256).Hash } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $raw 'terminal_cancel.result.json') -Encoding utf8
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          if (-not $complete) { if ($testExit -ne 0) { exit $testExit }; exit 1 }
      - name: Authentication configuration reservation, one exact owned wrapper
        id: auth_reservation
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'windows-diagnostics-raw'
          $selection = Get-Content -LiteralPath (Join-Path $raw 'build-selection.json') -Raw | ConvertFrom-Json
          $head = (& git rev-parse HEAD).Trim()

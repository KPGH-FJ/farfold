          $lines = @($errText -split "`r?`n")
          $innerPrefix = 'FARFOLD_TERMINAL_BOUNDED_UNKNOWN '
          $innerReceipts = @($lines | Where-Object { $_.StartsWith($innerPrefix, [StringComparison]::Ordinal) } | ForEach-Object { $_.Substring($innerPrefix.Length) | ConvertFrom-Json -AsHashtable -ErrorAction Stop })
          $inner = if ($innerReceipts.Count -eq 1) { $innerReceipts[0] } else { $null }
          $innerBoolYes = @('close_returned_error','registry_retained','exit_receipt_absent','master_transferred','activity_blocked','stop_requested','group_owner_known','group_inactive','process_not_running')
          $innerBoolNo = @('marker_observed','cursor_failed')
          $innerInts = @('cursor_queries','cursor_replies','cursor_pending','close_elapsed_millis','registry_reference_count','exit_frames_observed')
          $innerKeys = @('case') + $innerBoolYes + $innerBoolNo + $innerInts
          $validInner = $null -ne $inner -and $inner.case -ceq 'TerminalMasterBoundedUnknown' -and ((@($inner.Keys | Sort-Object) -join ',') -ceq (@($innerKeys | Sort-Object) -join ','))
          if ($validInner) {
            foreach ($key in $innerBoolYes + $innerBoolNo) { if ($inner[$key] -isnot [bool]) { $validInner = $false } }
            foreach ($key in $innerInts) { if (($inner[$key] -isnot [int] -and $inner[$key] -isnot [long] -and $inner[$key] -isnot [uint64]) -or $inner[$key] -lt 0) { $validInner = $false } }
          }
          if ($validInner) {
            foreach ($key in $innerBoolYes) { if ($inner[$key] -ne $true) { $validInner = $false } }
            foreach ($key in $innerBoolNo) { if ($inner[$key] -ne $false) { $validInner = $false } }
            $validInner = $validInner -and $inner.cursor_queries -gt 0 -and $inner.cursor_queries -le 8 -and $inner.cursor_replies -eq 0 -and $inner.cursor_pending -eq 0 -and $inner.close_elapsed_millis -ge 4900 -and $inner.close_elapsed_millis -le 7000 -and $inner.registry_reference_count -eq 1 -and $inner.exit_frames_observed -eq 0
          }

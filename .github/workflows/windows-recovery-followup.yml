name: Windows focused recovery follow-up

# Reuses original exact cases and assertions; the full cohort remains separate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery_followup:
    runs-on: windows-2022
    timeout-minutes: 78
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Parse the exact recovery diagnostic scripts before building
        timeout-minutes: 1
        run: |
          foreach ($path in @('.github/scripts/windows-recovery-followup-build.ps1', '.github/scripts/windows-capability-closeout.ps1', '.github/scripts/windows-native-loader-diagnostics.ps1', '.github/scripts/windows-recovery-followup-git-controls.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { $parseErrors | ForEach-Object { Write-Output $_.Message }; throw "PowerShell syntax invalid: $path" }
          }
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact source and original process fixture
        id: selected_build
        timeout-minutes: 30
        run: ./.github/scripts/windows-recovery-followup-build.ps1 -ExpectedHead '${{ github.sha }}'
      - name: Original three ordinary failing cases
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 11
        continue-on-error: true
        run: |
          ./.github/scripts/windows-capability-closeout.ps1 -ExpectedHead '${{ github.sha }}' -Mode Ordinary -CaseNames @('create-public-selected', 'ordinary-public-backup-cold-recover-keeps-original-and-rechecks', 'ordinary-public-confirm-delete-then-offline-cold-recover-preserves-all-material')
      - name: Exact original-list diagnostic parser control
        id: diagnostic_control
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $selection = Get-Content -LiteralPath 'windows-diagnostics-raw/build-selection.json' -Raw | ConvertFrom-Json
          $binary = (Resolve-Path -LiteralPath $selection.testBinary -ErrorAction Stop).Path
          if ($selection.sourceHead -cne '${{ github.sha }}' -or (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $selection.testBinarySha256) { throw 'Diagnostic control input changed' }
          $case = 'windows_process::current_members::tests::native_list_failure_diagnostic_preserves_api_error_and_exact_parse_categories'
          & $binary $case --exact --nocapture --test-threads=1 1> 'windows-diagnostics-raw/original-list-control.stdout.log' 2> 'windows-diagnostics-raw/original-list-control.stderr.log'
          $code = $LASTEXITCODE
          $out = Get-Content -LiteralPath 'windows-diagnostics-raw/original-list-control.stdout.log' -Raw
          $exact = $code -eq 0 -and [regex]::Matches($out, '(?m)^test ' + [regex]::Escape($case) + ' \.\.\. ok\r?$').Count -eq 1 -and [regex]::Matches($out, '(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;').Count -eq 1
          [ordered]@{ head = '${{ github.sha }}'; filter = $case; exitCode = $code; exactPassed = $exact } | ConvertTo-Json | Set-Content -LiteralPath 'windows-diagnostics-raw/original-list-control.result.json' -Encoding utf8
          if (-not $exact) { throw 'Original-list diagnostic control failed or absent' }
      - name: Original manual failures and unfinished cold recovery
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 21
        continue-on-error: true
        run: |
          ./.github/scripts/windows-capability-closeout.ps1 -ExpectedHead '${{ github.sha }}' -Mode FullSecurityManual -CaseNames @('public-retained-cold-recover', 'remove-late-ea', 'remove-late-security', 'public-remove-cold-recover')
      - name: Independent eight null-attributes regressions using the same build
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          ./.github/scripts/windows-capability-closeout.ps1 -ExpectedHead '${{ github.sha }}' -Mode NullAttributes
      - name: Independent four generic and noninteractive Git launch contracts
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          ./.github/scripts/windows-recovery-followup-git-controls.ps1 -ExpectedHead '${{ github.sha }}' -Mode LaunchContracts
      - name: Original seven Git settlement controls using the same build
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          ./.github/scripts/windows-recovery-followup-git-controls.ps1 -ExpectedHead '${{ github.sha }}' -Mode GitSettlement
      - name: Preserve the original recovery executable loader evidence
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath 'windows-diagnostics-raw/build-selection.json') {
            ./.github/scripts/windows-native-loader-diagnostics.ps1 -ExpectedHead '${{ github.sha }}' -RawDirectory 'windows-diagnostics-raw' -Mode ReadOnly
          } else { Write-Output 'No selected recovery build; loader evidence unavailable.' }
      - name: Keep raw outcomes including incomplete and failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-recovery-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-diagnostics-raw/
          if-no-files-found: error
          retention-days: 7
      - name: Require complete exact focused outcomes
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Get-Content -LiteralPath 'windows-diagnostics-raw/original-list-control.result.json' -Raw -ErrorAction Stop | ConvertFrom-Json
          if ($control.head -cne '${{ github.sha }}' -or $control.exactPassed -ne $true -or $control.exitCode -ne 0) { throw 'Diagnostic control incomplete or failed' }
          $expected = @{
            Ordinary = @('create-public-selected', 'ordinary-public-backup-cold-recover-keeps-original-and-rechecks', 'ordinary-public-confirm-delete-then-offline-cold-recover-preserves-all-material')
            FullSecurityManual = @('public-retained-cold-recover', 'remove-late-ea', 'remove-late-security', 'public-remove-cold-recover')
          }
          foreach ($mode in $expected.Keys) {
            $result = Get-Content -LiteralPath "windows-diagnostics-raw/capability-closeout-$mode.result.json" -Raw -ErrorAction Stop | ConvertFrom-Json
            $actualNames = @($result.selectedCaseNames | Sort-Object)
            $expectedNames = @($expected[$mode] | Sort-Object)
            if ($result.head -cne '${{ github.sha }}' -or $result.headStable -ne $true -or $result.inputsStable -ne $true -or $result.focusedSubsetOnly -ne $true -or $result.selectedTests -ne $expectedNames.Count -or $result.groupCount -ne $expectedNames.Count -or ($actualNames | ConvertTo-Json -Compress) -cne ($expectedNames | ConvertTo-Json -Compress) -or $result.exactAllGroupsPassed -ne $true) { throw "Focused $mode evidence incomplete or failed" }
          }
          # This separate cohort neither changes nor completes any original inventory.
          $attributes = Get-Content -LiteralPath 'windows-diagnostics-raw/capability-closeout-NullAttributes.result.json' -Raw -ErrorAction Stop | ConvertFrom-Json
          $attributeNames = @('null-exact-spellings', 'null-command-system-policy', 'null-rooted-lookalikes', 'null-owned-xdg-matrix', 'existing-source-profile-info', 'existing-configured-attributes-file', 'existing-held-absence-drive-relative', 'existing-selected-head-attributes' | Sort-Object)
          $actualAttributeNames = @($attributes.selectedCaseNames | Sort-Object)
          if ($attributes.head -cne '${{ github.sha }}' -or $attributes.mode -cne 'NullAttributes' -or $attributes.headStable -ne $true -or $attributes.inputsStable -ne $true -or $attributes.focusedSubsetOnly -ne $false -or $attributes.plannedOrdinaryTests -ne 8 -or $attributes.plannedManualTests -ne 0 -or $attributes.plannedTotalTests -ne 8 -or $attributes.selectedTests -ne 8 -or $attributes.groupCount -ne 8 -or ($actualAttributeNames | ConvertTo-Json -Compress) -cne ($attributeNames | ConvertTo-Json -Compress) -or $attributes.exactAllGroupsPassed -ne $true) { throw 'Independent null-attributes cohort incomplete or failed' }
          $gitControls = @{
            LaunchContracts = @('generic-command-shape', 'generic-stdio-contract', 'noninteractive-git-stdio-contract', 'noninteractive-git-error-contract')
            GitSettlement = @('natural-tail', 'original-nonzero', 'cancel-owned-job', 'original-deadline', 'late-stdout-limit', 'late-stderr-limit', 'changed-input')
          }
          foreach ($mode in $gitControls.Keys) {
            $result = Get-Content -LiteralPath "windows-diagnostics-raw/git-launch-controls-$mode.result.json" -Raw -ErrorAction Stop | ConvertFrom-Json
            $actualNames = @($result.selectedCaseNames | Sort-Object)
            $expectedNames = @($gitControls[$mode] | Sort-Object)
            if ($result.head -cne '${{ github.sha }}' -or $result.mode -cne $mode -or $result.headStable -isnot [bool] -or -not $result.headStable -or $result.inputsStable -isnot [bool] -or -not $result.inputsStable -or $result.sourceMapMatchesSelectedBuild -isnot [bool] -or -not $result.sourceMapMatchesSelectedBuild -or $result.selectedTests -ne $expectedNames.Count -or $result.groupCount -ne $expectedNames.Count -or ($actualNames | ConvertTo-Json -Compress) -cne ($expectedNames | ConvertTo-Json -Compress) -or $result.exactAllPassed -isnot [bool] -or -not $result.exactAllPassed) { throw "Independent Git $mode evidence incomplete or failed" }
          }

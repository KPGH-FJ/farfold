name: Windows actual P27 native control

# Explicit owned screenshot control only; no Agent, installation or account.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p27_native:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Parse the exact native diagnostic scripts before building
        timeout-minutes: 1
        run: |
          foreach ($path in @('.github/scripts/windows-p27-native.ps1', '.github/scripts/windows-native-loader-diagnostics.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { $parseErrors | ForEach-Object { Write-Output $_.Message }; throw "PowerShell syntax invalid: $path" }
          }
          python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/windows-pe-resource-inspection.py').read_text(encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual isolated P27 WebView2 control, one exact owned case
        timeout-minutes: 28
        run: ./.github/scripts/windows-p27-native.ps1 -ExpectedHead '${{ github.sha }}'
      - name: Verify same-build manifests and existing application resources
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath 'windows-p27-native-raw/build-selection.json') {
            python .github/scripts/windows-pe-resource-inspection.py --raw-directory windows-p27-native-raw --expected-head '${{ github.sha }}' --baseline-helper-manifest src-tauri/native/WindowsCommonControls.manifest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Output 'No selected native build; PE resource evidence unavailable.' }
      - name: Preserve loader evidence and a separate manifest-only list control
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath 'windows-p27-native-raw/build-selection.json') {
            ./.github/scripts/windows-native-loader-diagnostics.ps1 -ExpectedHead '${{ github.sha }}' -RawDirectory 'windows-p27-native-raw' -Mode P27ManifestControl
          } else { Write-Output 'No selected native build; loader evidence unavailable.' }
      - name: Keep exact native P27 evidence, including unavailable conditions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-p27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-p27-native-raw/
          if-no-files-found: error
          retention-days: 7

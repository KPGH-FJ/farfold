name: Windows launch prerequisites

# Explicit diagnostic for the original initial-connect and Create prerequisites.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and bind the selected library test binary
        id: selected_build
        timeout-minutes: 30
        run: ./.github/scripts/windows-selected-build.ps1 -ExpectedHead '${{ github.sha }}' -Scope LaunchPrerequisites
      - name: Observe the exact initial-connect cases and the two Create controls
        if: ${{ always() && steps.selected_build.outcome == 'success' }}
        timeout-minutes: 5
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: farfold-windows-launch-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-diagnostics-raw/
          if-no-files-found: error
          retention-days: 7

name: Windows launch prerequisites

# Selected native tests with source and executable receipts.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Exact native test cohort
        type: choice
        default: LaunchPrerequisites
        options:
          [
            LaunchPrerequisites,
            TransportTerminalFile,
            TransportOnly,
            TerminalClose,
            WorktreeRecovery,
            RetirementAndRemove,
            TerminalRetirementFix,
            RemoveRechecks,
            RemoveFixtures,
            RecoveryCancel,
            JobAccounting,
            AccessDiagnostics,
            GitJobWorktree,
            TerminalProbe,
            WorktreeWrapper,
            NativeRetirement,
            CreateEofRecovery,
            CreateEofChallenge,
            GitCompletionRecovery,
            FrozenRetirementResume,
            OpenFailureDiagnostics,
            McpScope,
            RecoveryApproval,
          ]
      resume_scope:
        description: Scope within FrozenRetirementResume only
        type: choice
        default: All
        options:
          [All, CreateUnfinishedAndTiming, FullRunFailures, BoundaryWaits]

permissions:
  contents: read

jobs:
  selected:
    runs-on: windows-2022
    timeout-minutes: ${{ (inputs.cohort == 'FrozenRetirementResume' || inputs.cohort == 'OpenFailureDiagnostics') && 70 || 45 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check synthetic protocol fixture interpreter
        if: ${{ inputs.cohort != 'LaunchPrerequisites' }}
        run: |
          $fixturePython = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          & $fixturePython -c "import sys; assert sys.version_info >= (3, 9); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ inputs.cohort == 'OpenFailureDiagnostics' || inputs.cohort == 'McpScope' || inputs.cohort == 'RecoveryApproval' }}
        with:
          node-version: 22.22.3
      - name: Prepare selected frontend dependencies
        if: ${{ inputs.cohort == 'OpenFailureDiagnostics' || inputs.cohort == 'McpScope' || inputs.cohort == 'RecoveryApproval' }}
        timeout-minutes: 7
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@9.15.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and bind the selected library test binary
        id: selected_build
        timeout-minutes: 30
        env:
          FARFOLD_SELECTED_COHORT: ${{ inputs.cohort }}
        run: ./.github/scripts/windows-selected-build.ps1 -ExpectedHead '${{ github.sha }}' -Scope LaunchPrerequisites -SelectedCohort $env:FARFOLD_SELECTED_COHORT
      - name: Check selected frontend types and exact open-failure tests
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'OpenFailureDiagnostics' }}
        timeout-minutes: 5
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort OpenFailureDiagnostics -Phase Frontend
      - name: Check selected shared types and exact MCP and queue schema tests
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'McpScope' }}
        timeout-minutes: 5
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort McpScope -Phase Frontend
      - name: Check selected types and exact recovery and approval frontend tests
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'RecoveryApproval' }}
        timeout-minutes: 5
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort RecoveryApproval -Phase Frontend
      - name: Run the selected native test cohort
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort != 'FrozenRetirementResume' && inputs.cohort != 'OpenFailureDiagnostics' }}
        timeout-minutes: ${{ inputs.cohort == 'GitCompletionRecovery' && 20 || (inputs.cohort == 'RemoveRechecks' || inputs.cohort == 'CreateEofRecovery' || inputs.cohort == 'CreateEofChallenge') && 14 || 8 }}
        env:
          FARFOLD_SELECTED_COHORT: ${{ inputs.cohort }}
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort $env:FARFOLD_SELECTED_COHORT
      - name: Run exact native open-failure ownership tests
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'OpenFailureDiagnostics' }}
        timeout-minutes: 5
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort OpenFailureDiagnostics
      - name: Require exact selected open-failure frontend and native receipts
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'OpenFailureDiagnostics' }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $selectionPath = 'windows-diagnostics-raw/build-selection.json'
          $selection = Get-Content -LiteralPath $selectionPath -Raw | ConvertFrom-Json
          $selectionHash = (Get-FileHash -LiteralPath $selectionPath -Algorithm SHA256).Hash
          foreach ($phase in @('Frontend', 'All')) {
            $result = Get-Content -LiteralPath "windows-diagnostics-raw/open-failure-$phase.result.json" -Raw -ErrorAction Stop | ConvertFrom-Json
            if ($result.sourceHead -cne '${{ github.sha }}' -or $result.cohort -cne 'OpenFailureDiagnostics' -or $result.phase -cne $phase -or $result.allReturned -ne $true -or $result.exactAllPassed -ne $true -or $result.sourceInputsStable -ne $true -or $result.selectionSha256 -cne $selectionHash -or $result.inputsAfterSha256 -cne $selection.inputsAfterSha256 -or $result.testBinarySha256 -cne $selection.testBinarySha256 -or $result.fixtureSha256 -cne $selection.fixtureSha256) { throw "Selected open-failure phase missing, incomplete or failed: $phase" }
            if ($phase -ceq 'Frontend' -and ($result.typecheckNaturalExitCode -ne 0 -or $result.testNaturalExitCode -ne 0 -or $result.runnerExitCode -ne 0 -or $result.expectedTests -ne 51 -or $result.actualTests -ne 51 -or $result.expectedFiles.Count -ne 2 -or $result.actualFiles.Count -ne 2 -or $result.exactFiles -ne $true)) { throw 'Selected frontend did not execute exactly and pass' }
            if ($phase -ceq 'All' -and ($result.expectedGroups -ne 5 -or $result.completedGroups -ne 5 -or $result.expectedExecutions -ne 18 -or @($result.groups | Where-Object { $_.naturalExitCode -ne 0 -or $_.passed -ne $true }).Count -ne 0 -or ($result.groups | Measure-Object -Property expectedTests -Sum).Sum -ne 18)) { throw 'Selected native cases did not execute exactly and pass' }
          }
      - name: Require exact selected MCP list, frontend and native receipts
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'McpScope' }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $selectionPath = 'windows-diagnostics-raw/build-selection.json'
          $selection = Get-Content -LiteralPath $selectionPath -Raw | ConvertFrom-Json
          $selectionHash = (Get-FileHash -LiteralPath $selectionPath -Algorithm SHA256).Hash
          foreach ($phase in @('List', 'Frontend', 'All')) {
            $resultPath = "windows-diagnostics-raw/mcp-scope-$phase.result.json"
            $result = Get-Content -LiteralPath $resultPath -Raw -ErrorAction Stop | ConvertFrom-Json
            if ($result.sourceHead -cne '${{ github.sha }}' -or $result.cohort -cne 'McpScope' -or $result.phase -cne $phase -or $result.allReturned -ne $true -or $result.exactAllPassed -ne $true -or $result.sourceInputsStable -ne $true -or $result.selectionSha256 -cne $selectionHash -or $result.inputsAfterSha256 -cne $selection.inputsAfterSha256 -or $result.testBinarySha256 -cne $selection.testBinarySha256 -or $result.fixtureSha256 -cne $selection.fixtureSha256) { throw "Selected MCP phase missing, incomplete or failed: $phase" }
            if ($phase -ceq 'List' -and ($result.naturalExitCode -ne 0 -or $result.runnerExitCode -ne 0 -or $result.expectedNames.Count -ne 18 -or $result.actualNames.Count -ne 18 -or $result.exactNames -ne $true)) { throw 'Selected MCP native list did not match the exact 18 tests' }
            if ($phase -ceq 'Frontend' -and ($result.typecheckNaturalExitCode -ne 0 -or $result.testNaturalExitCode -ne 0 -or $result.runnerExitCode -ne 0 -or $result.expectedTests -ne 15 -or $result.actualTests -ne 15 -or $result.expectedFiles.Count -ne 3 -or $result.actualFiles.Count -ne 3 -or $result.exactFiles -ne $true)) { throw 'Selected shared frontend did not execute exactly and pass' }
            if ($phase -ceq 'All') {
              $listHash = (Get-FileHash -LiteralPath 'windows-diagnostics-raw/mcp-scope-List.result.json' -Algorithm SHA256).Hash
              if ($result.expectedGroups -ne 1 -or $result.completedGroups -ne 1 -or $result.expectedExecutions -ne 18 -or $result.groups.Count -ne 1 -or $result.groups[0].expectedTests -ne 18 -or $result.groups[0].naturalExitCode -ne 0 -or $result.groups[0].passed -ne $true -or $result.listResultSha256 -cne $listHash) { throw 'Selected MCP native cases did not execute exactly and pass' }
            }
          }
      - name: Require exact selected recovery/approval list, frontend and native receipts
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'RecoveryApproval' }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $selectionPath = 'windows-diagnostics-raw/build-selection.json'
          $selection = Get-Content -LiteralPath $selectionPath -Raw | ConvertFrom-Json
          $selectionHash = (Get-FileHash -LiteralPath $selectionPath -Algorithm SHA256).Hash
          foreach ($phase in @('List', 'Frontend', 'All')) {
            $resultPath = "windows-diagnostics-raw/recovery-approval-$phase.result.json"
            $result = Get-Content -LiteralPath $resultPath -Raw -ErrorAction Stop | ConvertFrom-Json
            if ($result.sourceHead -cne '${{ github.sha }}' -or $result.cohort -cne 'RecoveryApproval' -or $result.phase -cne $phase -or $result.allReturned -ne $true -or $result.exactAllPassed -ne $true -or $result.sourceInputsStable -ne $true -or $result.selectionSha256 -cne $selectionHash -or $result.inputsAfterSha256 -cne $selection.inputsAfterSha256 -or $result.testBinarySha256 -cne $selection.testBinarySha256 -or $result.fixtureSha256 -cne $selection.fixtureSha256) { throw "Selected recovery/approval phase missing, incomplete or failed: $phase" }
            if ($phase -ceq 'List' -and ($result.naturalExitCode -ne 0 -or $result.runnerExitCode -ne 0 -or $result.expectedNames.Count -ne 2 -or $result.actualNames.Count -ne 2 -or $result.exactNames -ne $true)) { throw 'Selected recovery/approval native list did not match the exact 2 tests' }
            if ($phase -ceq 'Frontend' -and ($result.typecheckNaturalExitCode -ne 0 -or $result.testNaturalExitCode -ne 0 -or $result.runnerExitCode -ne 0 -or $result.expectedTests -ne 28 -or $result.actualTests -ne 28 -or $result.expectedFiles.Count -ne 4 -or $result.actualFiles.Count -ne 4 -or $result.exactFiles -ne $true)) { throw 'Selected shared frontend did not execute exactly and pass' }
            if ($phase -ceq 'All') {
              $listHash = (Get-FileHash -LiteralPath 'windows-diagnostics-raw/recovery-approval-List.result.json' -Algorithm SHA256).Hash
              if ($result.expectedGroups -ne 1 -or $result.completedGroups -ne 1 -or $result.expectedExecutions -ne 2 -or $result.groups.Count -ne 1 -or $result.groups[0].expectedTests -ne 2 -or $result.groups[0].naturalExitCode -ne 0 -or $result.groups[0].passed -ne $true -or $result.listResultSha256 -cne $listHash) { throw 'Selected recovery/approval native cases did not execute exactly and pass' }
            }
          }
      - name: Frozen candidate retirement proof and original EOF controls
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'All' }}
        timeout-minutes: 3
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase Retirement
      - name: Original Git certificate lifecycle and finite input controls
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'All' }}
        timeout-minutes: 3
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase GitControls
      - name: Existing create completion with test-only native wait timing
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'CreateUnfinishedAndTiming' }}
        timeout-minutes: 3
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase CreateTiming
      - name: Original create recovery and paired regressions
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'All' }}
        timeout-minutes: 20
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase CreateRecovery
      - name: Nine unfinished original create and recovery cases
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'CreateUnfinishedAndTiming' }}
        timeout-minutes: 20
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase CreateUnfinished
      - name: Five failures from the cancelled full run
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'FullRunFailures' }}
        timeout-minutes: 30
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase FullRunFailures
      - name: Affected original terminal controls
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'All' }}
        timeout-minutes: 3
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase Terminal
      - name: Two removal boundary waits from the completed full run
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' && inputs.resume_scope == 'BoundaryWaits' }}
        timeout-minutes: 6
        continue-on-error: true
        run: ./.github/scripts/windows-launch-prerequisites.ps1 -ExpectedHead '${{ github.sha }}' -Cohort FrozenRetirementResume -Phase BoundaryWaits
      - name: Require all resumed phases to have executed exactly and passed
        if: ${{ always() && steps.selected_build.outcome == 'success' && inputs.cohort == 'FrozenRetirementResume' }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $selection = Get-Content -LiteralPath 'windows-diagnostics-raw/build-selection.json' -Raw | ConvertFrom-Json
          $expected = @{ Retirement = @(6, 6); GitControls = @(3, 16); CreateRecovery = @(14, 20); Terminal = @(3, 3) }
          if ('${{ inputs.resume_scope }}' -ceq 'CreateUnfinishedAndTiming') { $expected = @{ CreateTiming = @(1, 1); CreateUnfinished = @(9, 9) } }
          if ('${{ inputs.resume_scope }}' -ceq 'FullRunFailures') { $expected = @{ FullRunFailures = @(3, 5) } }
          if ('${{ inputs.resume_scope }}' -ceq 'BoundaryWaits') { $expected = @{ BoundaryWaits = @(1, 2) } }
          foreach ($phase in $expected.Keys) {
            $result = Get-Content -LiteralPath "windows-diagnostics-raw/resume-$phase.result.json" -Raw -ErrorAction Stop | ConvertFrom-Json
            if ($result.sourceHead -cne '${{ github.sha }}' -or $result.cohort -cne 'FrozenRetirementResume' -or $result.phase -cne $phase -or $result.expectedGroups -ne $expected[$phase][0] -or $result.expectedExecutions -ne $expected[$phase][1] -or $result.completedGroups -ne $expected[$phase][0] -or $result.allReturned -ne $true -or $result.exactAllPassed -ne $true -or $result.sourceInputsStable -ne $true -or $result.testBinarySha256 -cne $selection.testBinarySha256 -or $result.fixtureSha256 -cne $selection.fixtureSha256) { throw "Resumed phase missing, incomplete or failed: $phase" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: farfold-windows-launch-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-diagnostics-raw/
          if-no-files-found: error
          retention-days: 7

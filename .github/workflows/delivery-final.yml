name: Farfold final delivery

on:
  workflow_run:
    workflows: [Farfold delivery]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to recheck after a Codex review or private evidence submission
        type: string
        required: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  checks: write

concurrency:
  group: final-delivery-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Publish final delivery result
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      (github.event.comment.user.id == 199175422 ||
      (github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '<!-- farfold-private-delivery:v1 -->') ||
      startsWith(github.event.changes.body.from, '<!-- farfold-private-delivery:v1 -->'))))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job can write commit checks. Do not check out the PR, execute
      # its scripts, install its dependencies, or restore its caches here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Verify engineering run and authenticated independent review
        env:
          GH_TOKEN: ${{ github.token }}
          FARFOLD_PRIVATE_EVIDENCE_PUBLIC_KEY: ${{ vars.FARFOLD_PRIVATE_EVIDENCE_PUBLIC_KEY }}
        run: node scripts/delivery-final.mjs

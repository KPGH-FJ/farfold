name: Farfold final delivery

on:
  workflow_run:
    workflows: [Farfold delivery]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to recheck after an independent approval or evidence change
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: final-delivery-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Publish final delivery result
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job can write commit checks. Do not check out the PR, execute
      # its scripts, install its dependencies, or restore its caches here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Verify engineering run and authenticated independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/delivery-final.mjs

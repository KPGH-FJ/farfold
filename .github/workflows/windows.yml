name: Windows verification

# Run explicitly while Windows implementation is being completed.
# Full remains engineering plus unsigned build. InstallLifecycle is a separate
# explicit install/uninstall receipt without App launch, never full acceptance.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit Windows verification scope
        type: choice
        default: Full
        options: [Full, InstallLifecycle]

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ inputs.scope != 'InstallLifecycle' }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned JavaScript toolchain
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@9.15.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          corepack pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust:
    if: ${{ inputs.scope != 'InstallLifecycle' }}
    runs-on: windows-2022
    # Full41830692244 spent ~19m compiling and ~40m testing before the old
    # job cap cancelled it. This is finite runner capacity, not a test deadline.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
      - name: Check synthetic protocol fixture interpreter
        run: |
          $fixturePython = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          & $fixturePython -c "import sys; assert sys.version_info >= (3, 9); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check shared Rust and Windows implementation
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path src-tauri/Cargo.toml --locked --example windows_process_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  installer:
    needs: [frontend, rust]
    if: ${{ always() && !cancelled() && (inputs.scope == 'InstallLifecycle' || (needs.frontend.result == 'success' && needs.rust.result == 'success')) }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned JavaScript toolchain
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@9.15.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
      - name: Install locked JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build unsigned per-user installer
        if: ${{ inputs.scope != 'InstallLifecycle' }}
        run: corepack pnpm tauri build --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Build and bind the explicit installation lifecycle candidate
        if: ${{ inputs.scope == 'InstallLifecycle' }}
        run: ./.github/scripts/windows-install-lifecycle.ps1 -ExpectedHead '${{ github.sha }}' -Phase Build
      - name: Keep unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-x64-unsigned
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Verify per-user installation and uninstall data retention without App launch
        if: ${{ inputs.scope == 'InstallLifecycle' }}
        timeout-minutes: 10
        run: ./.github/scripts/windows-install-lifecycle.ps1 -ExpectedHead '${{ github.sha }}' -Phase Install
      - name: Keep explicit installation lifecycle receipts
        if: ${{ always() && inputs.scope == 'InstallLifecycle' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-install-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-install-raw/
          if-no-files-found: warn
          retention-days: 7

  # Keep the original Full context; a skipped dependency is not success.
  verify:
    if: ${{ always() && inputs.scope != 'InstallLifecycle' }}
    needs: [frontend, rust, installer]
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require every Windows verification job to succeed
        run: |
          if ('${{ needs.frontend.result }}' -ne 'success' -or '${{ needs.rust.result }}' -ne 'success' -or '${{ needs.installer.result }}' -ne 'success') { exit 1 }

name: Windows verification

# Run explicitly while Windows implementation is being completed. This is an
# unsigned build check, never a release/publish or an installed-product receipt.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned JavaScript toolchain
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@9.15.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          corepack pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
      - name: Check synthetic protocol fixture interpreter
        run: |
          $fixturePython = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          & $fixturePython -c "import sys; assert sys.version_info >= (3, 9); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check shared Rust and Windows implementation
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path src-tauri/Cargo.toml --locked --example windows_process_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  installer:
    needs: [frontend, rust]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long Git paths before checkout
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Prepare pinned JavaScript toolchain
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@9.15.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
      - name: Install locked JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build unsigned per-user installer
        run: corepack pnpm tauri build --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Keep unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farfold-windows-x64-unsigned
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # Keep the original verification context; a skipped dependency is not success.
  verify:
    if: ${{ always() }}
    needs: [frontend, rust, installer]
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require every Windows verification job to succeed
        run: |
          if ('${{ needs.frontend.result }}' -ne 'success' -or '${{ needs.rust.result }}' -ne 'success' -or '${{ needs.installer.result }}' -ne 'success') { exit 1 }

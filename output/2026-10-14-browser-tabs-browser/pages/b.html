<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>P30_PAGE_B</title><style>body{font:18px system-ui;margin:24px;background:#f1f9f0}button,input{font:inherit;margin:8px;padding:8px}.spacer{height:1500px;background:linear-gradient(white,#dde7ef)}output{font-weight:700}</style><h1>P30_PAGE_B</h1><p>独立页面内存样本 B</p><label>页面笔记<input id="note" aria-label="页面笔记" value="B_INITIAL"></label><button id="increment">增加计数</button><p>计数 <output id="count">0</output></p><div class="spacer">向下滚动查看页面位置</div><p id="end">P30_B_END</p><script>let counter=0;document.getElementById('increment').onclick=()=>document.getElementById('count').textContent=String(++counter);</script></html>

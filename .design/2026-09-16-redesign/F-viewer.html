<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farfold F 稿 · 浏览外壳</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");

      :root {
        --bg: #ffffff;
        --sidebar: #f7f7f5;
        --row-hover: #efefec;
        --row-active: #e9e9e5;
        --ink: #1d1d1a;
        --ink-2: #6e6e68;
        --ink-3: #8a8a83;
        --line: #ebebe7;
        --accent: #4f46e5;
        --amber: #b45309;
        --mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #e9e9e6;
      }
      body {
        display: flex;
      }

      /* ── 左侧：帧导航 ── */
      .nav {
        width: 220px;
        flex-shrink: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 20px 12px 12px;
      }
      .brand {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        padding: 0 10px;
        margin-bottom: 4px;
      }
      .nav-sub {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
        padding: 0 10px;
        margin-bottom: 18px;
        letter-spacing: 0.04em;
      }
      .n-item {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 13px;
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
      }
      .n-item:hover {
        background: var(--row-hover);
      }
      .n-item.active {
        background: var(--row-active);
        color: var(--ink);
        font-weight: 500;
      }
      .n-item .no {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
        width: 20px;
        flex-shrink: 0;
      }
      .n-item.active .no {
        color: var(--accent);
      }

      .nav-foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 10px 10px 2px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
        line-height: 2;
      }
      .nav-foot kbd {
        font-family: var(--mono);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        background: #fff;
        font-size: 9.5px;
      }

      /* ── 右侧：视口 ── */
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .stage-bar {
        height: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: #fbfbfa;
      }
      .stage-bar .t {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink);
      }
      .stage-bar .d {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .stage-bar .open {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-2);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .stage-bar .open:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .viewport {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .frame {
        position: absolute;
        top: 0;
        left: 0;
        border: none;
        transform-origin: top left;
        background: #e9e9e6;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="brand">Farfold</div>
      <div class="nav-sub">F 稿 · 浏览外壳</div>
      <div id="nav-list"></div>
      <div class="nav-foot">
        <kbd>←</kbd> <kbd>→</kbd> 切换帧<br />
        视口内可滚动查看完整帧
      </div>
    </nav>

    <div class="stage">
      <div class="stage-bar">
        <span class="t" id="cur-title"></span>
        <span class="d" id="cur-desc"></span>
        <a class="open" id="cur-open" href="#" target="_blank"
          >在新标签页打开原文件 →</a
        >
      </div>
      <div class="viewport" id="viewport">
        <iframe class="frame" id="frame" src=""></iframe>
      </div>
    </div>

    <script>
      // 帧清单：与目录内文件一一对应
      const FRAMES = [
        {
          no: "F1",
          file: "F-main-frame.html",
          title: "主界面",
          desc: "调度台 · 三级状态 · 消息栏三态 · 审批浮起",
        },
        {
          no: "F2",
          file: "F-artifact-pane.html",
          title: "产物窗格",
          desc: "通用承载层 · diff / 网页预览 · 内容唤起",
        },
        {
          no: "F3",
          file: "F-switcher.html",
          title: "Agent 切换器",
          desc: "新会话 / 切换会话 · 绑定不可变",
        },
        {
          no: "F4",
          file: "F-start-empty.html",
          title: "开始页与空态",
          desc: "首次启动引导接入 · 无会话起点",
        },
        {
          no: "F5",
          file: "F-settings.html",
          title: "设置",
          desc: "Agent 接入 · 能力三态 · LifeModel 治理",
        },
        {
          no: "F6",
          file: "F-approval.html",
          title: "审批变体与沉降态",
          desc: "写文件 / Bash / 依赖 / 批量 · 裁决后沉降",
        },
        {
          no: "F7",
          file: "F-command-palette.html",
          title: "命令面板 ⌘K",
          desc: "会话 / 命令 / 动作 · 与切换器同一语义",
        },
        {
          no: "IDX",
          file: "F-index.html",
          title: "总览索引",
          desc: "四条原则 · token · 组件清单 · 帧导航",
        },
      ];

      // 帧内容的原始排版宽度：1440 窗口 + 两侧留白
      const FRAME_W = 1600;

      const navList = document.getElementById("nav-list");
      const viewport = document.getElementById("viewport");
      const frame = document.getElementById("frame");
      const curTitle = document.getElementById("cur-title");
      const curDesc = document.getElementById("cur-desc");
      const curOpen = document.getElementById("cur-open");

      let cur = 0;

      FRAMES.forEach((f, i) => {
        const el = document.createElement("div");
        el.className = "n-item";
        el.innerHTML =
          '<span class="no">' + f.no + "</span><span>" + f.title + "</span>";
        el.addEventListener("click", () => go(i));
        navList.appendChild(el);
      });

      function go(i) {
        cur = (i + FRAMES.length) % FRAMES.length;
        const f = FRAMES[cur];
        frame.src = f.file;
        curTitle.textContent = f.no + " · " + f.title;
        curDesc.textContent = f.desc;
        curOpen.href = f.file;
        [...navList.children].forEach((el, j) =>
          el.classList.toggle("active", j === cur),
        );
        location.hash = f.file;
      }

      function fit() {
        // 宽度缩放到视口；高度反向放大，使缩放后刚好填满视口（帧内部自行滚动）
        const s = Math.min(1, viewport.clientWidth / FRAME_W);
        frame.style.width = FRAME_W + "px";
        frame.style.height = viewport.clientHeight / s + "px";
        frame.style.transform = "scale(" + s + ")";
      }

      window.addEventListener("resize", fit);
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") go(cur - 1);
        if (e.key === "ArrowRight") go(cur + 1);
      });

      // 支持 #文件名 直达
      const hashIdx = FRAMES.findIndex((f) => "#" + f.file === location.hash);
      fit();
      go(hashIdx >= 0 ? hashIdx : 0);
    </script>
  </body>
</html>
